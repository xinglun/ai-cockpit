name: ai-cockpit quality

on:
  push:
    branches:
      - main
  pull_request:

# A newer commit for the same pull request supersedes the previous quality
# run. Main pushes are never cancelled by this PR-only policy, and release
# workflow truth has its own immutable concurrency boundary.
concurrency:
  group: ai-cockpit-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the dynamic quality route
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_revision="$(git rev-parse "${PR_BASE_SHA}^{commit}")"
            stage=pull_request
          else
            base_revision="$EVENT_BEFORE"
            stage=merge
            if [[ ! "$base_revision" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$base_revision" == 0000000000000000000000000000000000000000 ]] ||
               ! git cat-file -e "${base_revision}^{commit}" 2>/dev/null; then
              base_revision="$(git rev-parse "${head_revision}^" 2>/dev/null || printf '%s' "$head_revision")"
            fi
          fi
          mapfile -t contracts < <(find .ai/work-items/active -maxdepth 1 -type f -name '*.contract.json' -print | sort)
          (( ${#contracts[@]} <= 1 )) || { echo 'multiple active Contracts cannot select one quality route' >&2; exit 1; }
          if [[ "$EVENT_NAME" != pull_request && ${#contracts[@]} == 1 ]]; then
            contract_base_revision="$(jq -er '.baseRevision' "${contracts[0]}")"
            [[ "$contract_base_revision" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'active Contract baseRevision is not a valid commit' >&2
              exit 1
            }
            base_revision="$(git rev-parse "${contract_base_revision}^{commit}")"
          fi
          route_args=(
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --base "$base_revision"
            --head "$head_revision"
            --stage "$stage"
            --risk normal
            --receipt target/quality-route.json
          )
          if (( ${#contracts[@]} == 1 )); then route_args+=(--contract "${contracts[0]}"); fi
          python3 tests/ci/quality_route.py "${route_args[@]}" >/dev/null
          echo "profile=$(jq -er '.selectedProfile' target/quality-route.json)" >> "$GITHUB_OUTPUT"

  quality:
    needs: route
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Plan the initial typed repository quality route
        id: initial_quality_route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_revision="$(git rev-parse "${PR_BASE_SHA}^{commit}")"
            stage=pull_request
          else
            base_revision="$EVENT_BEFORE"
            stage=merge
            if [[ ! "$base_revision" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$base_revision" == 0000000000000000000000000000000000000000 ]] ||
               ! git cat-file -e "${base_revision}^{commit}" 2>/dev/null; then
              base_revision="$(git rev-parse "${head_revision}^" 2>/dev/null || printf '%s' "$head_revision")"
            fi
          fi
          mapfile -t contracts < <(find .ai/work-items/active -maxdepth 1 -type f -name '*.contract.json' -print | sort)
          (( ${#contracts[@]} <= 1 )) || { echo 'multiple active Contracts cannot select one quality route' >&2; exit 1; }
          if [[ "$EVENT_NAME" != pull_request && ${#contracts[@]} == 1 ]]; then
            contract_base_revision="$(jq -er '.baseRevision' "${contracts[0]}")"
            [[ "$contract_base_revision" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'active Contract baseRevision is not a valid commit' >&2
              exit 1
            }
            base_revision="$(git rev-parse "${contract_base_revision}^{commit}")"
          fi
          route_args=(
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --base "$base_revision"
            --head "$head_revision"
            --stage "$stage"
            --risk normal
            --receipt target/quality-route-initial.json
          )
          if (( ${#contracts[@]} == 1 )); then route_args+=(--contract "${contracts[0]}"); fi
          python3 tests/ci/quality_route.py "${route_args[@]}" >/dev/null
          echo "profile=$(jq -er '.selectedProfile' target/quality-route-initial.json)" >> "$GITHUB_OUTPUT"
          echo "base_revision=$base_revision" >> "$GITHUB_OUTPUT"
          echo "head_revision=$head_revision" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "contract_path=${contracts[0]:-}" >> "$GITHUB_OUTPUT"
      - name: verify immutable Runtime shadow
        if: steps.initial_quality_route.outputs.profile != 'light' && steps.initial_quality_route.outputs.contract_path != ''
        shell: bash
        run: bash tests/ci/runtime_verify_shadow.sh "$GITHUB_WORKSPACE" target/ci-runtime-verify-shadow.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.initial_quality_route.outputs.profile != 'light' && steps.initial_quality_route.outputs.contract_path != ''
        with:
          name: ci-runtime-verify-shadow
          path: target/ci-runtime-verify-shadow.json
          if-no-files-found: error
          retention-days: 7
      - name: Finalize the typed repository quality route
        id: quality_route
        shell: bash
        env:
          ROUTE_BASE_REVISION: ${{ steps.initial_quality_route.outputs.base_revision }}
          ROUTE_CONTRACT_PATH: ${{ steps.initial_quality_route.outputs.contract_path }}
          ROUTE_HEAD_REVISION: ${{ steps.initial_quality_route.outputs.head_revision }}
          ROUTE_STAGE: ${{ steps.initial_quality_route.outputs.stage }}
        run: |
          set -euo pipefail
          route_args=(
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --base "$ROUTE_BASE_REVISION"
            --head "$ROUTE_HEAD_REVISION"
            --stage "$ROUTE_STAGE"
            --risk normal
            --receipt target/quality-route.json
          )
          if [[ -n "$ROUTE_CONTRACT_PATH" ]]; then route_args+=(--contract "$ROUTE_CONTRACT_PATH"); fi
          python3 tests/ci/quality_route.py "${route_args[@]}" >/dev/null
          echo "profile=$(jq -er '.selectedProfile' target/quality-route.json)" >> "$GITHUB_OUTPUT"
      - name: Verify the route plan is stable across jobs
        shell: bash
        env:
          ROUTE_PROFILE_FROM_PLAN: ${{ needs.route.outputs.profile }}
        run: |
          set -euo pipefail
          test "$(jq -er '.selectedProfile' target/quality-route.json)" = "$ROUTE_PROFILE_FROM_PLAN"
      - name: Evaluate Rust Contract-aware quality gate
        if: steps.quality_route.outputs.profile != 'light' && steps.initial_quality_route.outputs.contract_path != ''
        shell: bash
        env:
          ROUTE_BASE_REVISION: ${{ steps.initial_quality_route.outputs.base_revision }}
          ROUTE_CONTRACT_PATH: ${{ steps.initial_quality_route.outputs.contract_path }}
          ROUTE_STAGE: ${{ steps.initial_quality_route.outputs.stage }}
        run: |
          set -euo pipefail
          cargo run --locked --package cockpit-cli -- \
            gate \
            --repo "$GITHUB_WORKSPACE" \
            --contract "$ROUTE_CONTRACT_PATH" \
            --stage "$ROUTE_STAGE" \
            --runner hosted \
            --base-revision "$ROUTE_BASE_REVISION" \
            --report target/rust-contract-quality-gate.json
      - name: run repository gates exactly once
        shell: bash
        env:
          ROUTE_CONTRACT_PATH: ${{ steps.initial_quality_route.outputs.contract_path }}
          ROUTE_PROFILE: ${{ steps.quality_route.outputs.profile }}
        run: |
          set -euo pipefail
          # The gate consumes GitHub's immutable push/PR context
          # (GITHUB_EVENT_NAME, GITHUB_REF, GITHUB_SHA) to recognize only the
          # bounded post-merge archive-to-close transition. No bypass context
          # or repository-global current-project state is introduced here.
          gate_args=(
            python3 tests/ci/run_repository_gates.py
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --route-receipt target/quality-route.json
            --report target/repository-gates.json
          )
          if [[ "$ROUTE_PROFILE" != light && -n "$ROUTE_CONTRACT_PATH" ]]; then
            gate_args+=(--contract-gate-report target/rust-contract-quality-gate.json)
          fi
          "${gate_args[@]}"
      - name: verify workspace package coverage receipt
        if: steps.quality_route.outputs.profile != 'light'
        shell: bash
        run: test -f target/workspace-package-coverage.json && test ! -L target/workspace-package-coverage.json
      - name: verify three-language work-item counterparts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r english; do
            test -f "${english%.md}.zh-CN.md"
            test -f "${english%.md}.ja.md"
          done < <(find docs/work-items -maxdepth 1 -name 'WI-*.md' ! -name '*.zh-CN.md' ! -name '*.ja.md' | sort)
      - name: upload deterministic gate receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: repository-gate-receipts
          path: |
            target/governance-integrity-report.json
            target/quality-route-initial.json
            target/quality-route.json
            target/repository-gates.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Rust Contract gate receipt
        if: always() && steps.quality_route.outputs.profile != 'light' && steps.initial_quality_route.outputs.contract_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-contract-quality-gate
          path: target/rust-contract-quality-gate.json
          if-no-files-found: error
          retention-days: 7
      - name: upload workspace package coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.quality_route.outputs.profile != 'light' && hashFiles('target/workspace-package-coverage.json') != ''
        with:
          name: workspace-package-coverage
          path: |
            target/workspace-package-coverage.json
          if-no-files-found: error
          retention-days: 7

  windows-runtime:
    needs: route
    if: needs.route.result == 'success' && needs.route.outputs.profile != 'light'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: verify Windows agent adapter boundaries
        run: cargo test -p cockpit-agent --all-targets
      - name: verify Windows process and executable identity boundaries
        run: cargo test -p cockpit-verification --test execution
      - name: verify Windows repository boundaries
        run: cargo test -p cockpit-repository --test receipt_store --test verification_context --test verification_service

  v1-behavioral-oracle:
    needs: route
    if: needs.route.result == 'success' && needs.route.outputs.profile != 'light'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: verify local-only reference-source policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/conformance/reference_source_policy.py \
            --lock tests/conformance/reference-source.lock
          bash tests/conformance/reference_source_policy_check.sh
      - name: compare Rust semantics with the committed offline corpus
        run: cargo test -p cockpit-core --test conformance -- --test-threads=1
