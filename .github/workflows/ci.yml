name: ai-cockpit quality

on:
  push:
    branches:
      - main
  pull_request:

# A newer commit for the same pull request supersedes the previous quality
# run. Main pushes are never cancelled by this PR-only policy, and release
# workflow truth has its own immutable concurrency boundary.
concurrency:
  group: ai-cockpit-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.execute.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: Plan the dynamic quality route
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_revision="$(git rev-parse "${PR_BASE_SHA}^{commit}")"
            head_revision="$(git rev-parse "${PR_HEAD_SHA}^{commit}")"
            stage=pull_request
          else
            stage=merge
          fi
          selector_args=(
            --repo "$GITHUB_WORKSPACE"
            --event "$EVENT_NAME"
            --head "$head_revision"
            --output target/quality-selection.json
          )
          if [[ "$EVENT_NAME" == pull_request ]]; then
            selector_args+=(--pr-head-ref "$PR_HEAD_REF" --pr-url "$PR_URL")
          fi
          tests/ci/resolve_work_item.sh "${selector_args[@]}"
          contract_path="$(jq -r '.contractPath // empty' target/quality-selection.json)"
          if [[ "$EVENT_NAME" != pull_request ]]; then
            # Ordinary merge routes intentionally have no Contract/base
            # identity after a Work Item has been archived before its PR is
            # reviewed. The typed route computes the repository base below.
            base_revision="$(jq -r '.baseRevision // empty' target/quality-selection.json)"
          fi
          echo "selection_method=$(jq -er '.selectionMethod' target/quality-selection.json)" >> "$GITHUB_OUTPUT"
          echo "work_item_id=$(jq -r '.workItemId // empty' target/quality-selection.json)" >> "$GITHUB_OUTPUT"
          echo "base_revision=$base_revision" >> "$GITHUB_OUTPUT"
          echo "head_revision=$head_revision" >> "$GITHUB_OUTPUT"
      - name: Build the shared Rust gate-plan tool once
        run: cargo build --locked --package cockpit-cli --release
      - name: Execute the dynamic quality route
        id: execute
        shell: bash
        env:
          ROUTE_BASE_REVISION: ${{ steps.plan.outputs.base_revision }}
          ROUTE_HEAD_REVISION: ${{ steps.plan.outputs.head_revision }}
        run: |
          set -euo pipefail
          head_revision="$ROUTE_HEAD_REVISION"
          base_revision="$ROUTE_BASE_REVISION"
          stage=pull_request
          [[ "$GITHUB_EVENT_NAME" == pull_request ]] || stage=merge
          route_args=(
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --base "${base_revision:-$(git rev-parse "${head_revision}^")}"
            --head "$head_revision"
            --stage "$stage"
            --risk normal
            --receipt target/quality-route.json
          )
          contract_path="$(jq -r '.contractPath // empty' target/quality-selection.json)"
          [[ -n "$contract_path" ]] && route_args+=(--contract "$contract_path")
          python3 tests/ci/quality_route.py "${route_args[@]}" --rust-bin target/release/ai-cockpit >/dev/null
          echo "profile=$(jq -er '.selectedProfile' target/quality-route.json)" >> "$GITHUB_OUTPUT"
      - name: Upload the shared Rust gate-plan tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-gate-plan-tool
          path: |
            target/release/ai-cockpit
            target/quality-selection.json
            target/quality-route.json
          if-no-files-found: error
          retention-days: 7

  quality:
    needs: route
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Download the shared Rust gate-plan tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-gate-plan-tool
          path: target
      - name: Make the shared Rust gate-plan tool executable
        run: chmod +x target/release/ai-cockpit
      - name: Bind source and tested revisions; validate the shared typed quality route
        id: quality_route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tested_revision="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          source_revision="$tested_revision"
          [[ "$EVENT_NAME" != pull_request ]] || source_revision="$PR_HEAD_SHA"
          receipt_head="$(jq -r '.headRevision // empty' target/quality-route.json 2>/dev/null || true)"
          tested_parents="$(git show -s --format=%P "$tested_revision" 2>/dev/null || true)"
          jq -n \
            --arg eventName "$EVENT_NAME" \
            --arg sourceHeadRevision "$source_revision" \
            --arg routeHeadRevision "$receipt_head" \
            --arg testedRevision "$tested_revision" \
            --arg testedParents "$tested_parents" \
            '{schemaVersion:1,kind:"ci_revision_binding",eventName:$eventName,sourceHeadRevision:$sourceHeadRevision,routeHeadRevision:$routeHeadRevision,testedRevision:$testedRevision,testedParents:($testedParents|split(" ")|map(select(length>0)))}' \
            > target/ci-revision-binding.json
          if [[ "$EVENT_NAME" == pull_request ]]; then
            source_revision="$(git rev-parse "${PR_HEAD_SHA}^{commit}")"
            expected_base="$(git rev-parse "${PR_BASE_SHA}^{commit}")"
            read -r -a merge_parents <<<"$(git rev-list --parents -n 1 "$tested_revision")"
            test "${merge_parents[1]:-}" = "$expected_base" || {
              echo 'tested PR merge commit does not bind the declared base revision' >&2
              exit 1
            }
            test "${merge_parents[2]:-}" = "$source_revision" || {
              echo 'tested PR merge commit does not bind the declared source head' >&2
              exit 1
            }
          fi
          expected_stage=pull_request
          [[ "$EVENT_NAME" == pull_request ]] || expected_stage=merge
          receipt_stage="$(jq -er '.stage' target/quality-route.json)"
          test "$receipt_head" = "$source_revision" || {
            echo 'quality route receipt is bound to a different source revision' >&2
            exit 1
          }
          if [[ "$EVENT_NAME" != pull_request ]]; then
            test "$tested_revision" = "$source_revision"
          fi
          test "$receipt_stage" = "$expected_stage" || {
            echo 'quality route receipt is bound to a different event stage' >&2
            exit 1
          }
          contract_path="$(jq -r '.contractPath // empty' target/quality-route.json)"
          if [[ -n "$contract_path" ]]; then test -f "$contract_path"; fi
          echo "profile=$(jq -er '.selectedProfile' target/quality-route.json)" >> "$GITHUB_OUTPUT"
          echo "base_revision=$(jq -er '.baseRevision' target/quality-route.json)" >> "$GITHUB_OUTPUT"
          echo "head_revision=$receipt_head" >> "$GITHUB_OUTPUT"
          echo "tested_revision=$tested_revision" >> "$GITHUB_OUTPUT"
          echo "stage=$receipt_stage" >> "$GITHUB_OUTPUT"
          echo "contract_path=$contract_path" >> "$GITHUB_OUTPUT"
      - name: Upload quality revision binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-revision-binding
          path: target/ci-revision-binding.json
          if-no-files-found: warn
          retention-days: 7
      - name: verify immutable Runtime shadow
        if: steps.quality_route.outputs.profile != 'light' && steps.quality_route.outputs.contract_path != ''
        shell: bash
        run: bash tests/ci/runtime_verify_shadow.sh "$GITHUB_WORKSPACE" target/ci-runtime-verify-shadow.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.quality_route.outputs.profile != 'light' && steps.quality_route.outputs.contract_path != ''
        with:
          name: ci-runtime-verify-shadow
          path: target/ci-runtime-verify-shadow.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify the route plan is stable across jobs
        shell: bash
        env:
          ROUTE_PROFILE_FROM_PLAN: ${{ needs.route.outputs.profile }}
        run: |
          set -euo pipefail
          test "$(jq -er '.selectedProfile' target/quality-route.json)" = "$ROUTE_PROFILE_FROM_PLAN"
      - name: Run admitted hosted Work Item verification with the candidate Runtime
        if: steps.quality_route.outputs.contract_path != ''
        shell: bash
        env:
          ROUTE_CONTRACT_PATH: ${{ steps.quality_route.outputs.contract_path }}
          AI_COCKPIT_DEFER_WORKTREE_CLEANUP: ${{ steps.quality_route.outputs.profile != 'light' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/tests/ci/run_process_observer_test_runner.sh
        run: |
          set -euo pipefail
          tests/ci/run_hosted_runtime_verification.sh \
            target/release/ai-cockpit \
            "$GITHUB_WORKSPACE" \
            "$ROUTE_CONTRACT_PATH" \
            target
      - name: Evaluate Rust Contract-aware quality gate
        if: steps.quality_route.outputs.contract_path != ''
        shell: bash
        env:
          ROUTE_BASE_REVISION: ${{ steps.quality_route.outputs.base_revision }}
          ROUTE_CONTRACT_PATH: ${{ steps.quality_route.outputs.contract_path }}
          ROUTE_STAGE: ${{ steps.quality_route.outputs.stage }}
        run: |
          set -euo pipefail
          target/release/ai-cockpit \
            gate \
            --repo "$GITHUB_WORKSPACE" \
            --contract "$ROUTE_CONTRACT_PATH" \
            --stage "$ROUTE_STAGE" \
            --runner hosted \
            --base-revision "$ROUTE_BASE_REVISION" \
            --report target/rust-contract-quality-gate.json
      - name: Build legacy Runtime for coordination compatibility
        if: steps.quality_route.outputs.profile != 'light'
        shell: bash
        env:
          LEGACY_RUNTIME_SHA: 73f8bd2b86338f8025ef12ba9fff15bf45ef5782
        run: |
          set -euo pipefail
          legacy_parent="$(mktemp -d "$RUNNER_TEMP/ai-cockpit-legacy.XXXXXX")"
          legacy_source="$legacy_parent/source"
          cleanup() {
            git worktree remove --force "$legacy_source" >/dev/null 2>&1 || true
            rmdir "$legacy_parent" 2>/dev/null || true
          }
          trap cleanup EXIT
          git worktree add --detach "$legacy_source" "$LEGACY_RUNTIME_SHA"
          cargo build --locked --release \
            --manifest-path "$legacy_source/Cargo.toml" \
            --target-dir "$GITHUB_WORKSPACE/target/legacy-runtime" \
            -p cockpit-cli --bin ai-cockpit
          test -x "$GITHUB_WORKSPACE/target/legacy-runtime/release/ai-cockpit"
      - name: run repository gates exactly once
        shell: bash
        env:
          ROUTE_CONTRACT_PATH: ${{ steps.quality_route.outputs.contract_path }}
          ROUTE_PROFILE: ${{ steps.quality_route.outputs.profile }}
          AI_COCKPIT_VERIFICATION_RECEIPT: ${{ steps.quality_route.outputs.contract_path != '' && 'target/hosted-runtime-verification.json' || '' }}
          AI_COCKPIT_VERIFICATION_ORCHESTRATION: ${{ steps.quality_route.outputs.contract_path != '' && 'target/hosted-runtime-orchestration.json' || '' }}
          AI_COCKPIT_RUNTIME_BIN: target/release/ai-cockpit
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/tests/ci/run_process_observer_test_runner.sh
        run: |
          set -euo pipefail
          verification_repository="$GITHUB_WORKSPACE"
          if [[ -n "$ROUTE_CONTRACT_PATH" ]]; then
            cleanup_record=target/hosted-runtime-worktree-cleanup.json
            test -f "$cleanup_record" && test ! -L "$cleanup_record"
            cleanup_state=$(jq -er '.state | strings' "$cleanup_record")
            if [[ "$cleanup_state" == deferred_for_consumer ]]; then
              verification_repository=$(jq -er '.isolatedRepository | strings | select(length > 0)' "$cleanup_record")
            fi
          fi
          export AI_COCKPIT_VERIFICATION_REPOSITORY="$verification_repository"
          # The gate consumes GitHub's immutable push/PR context
          # (GITHUB_EVENT_NAME, GITHUB_REF, GITHUB_SHA) to recognize only the
          # bounded post-merge archive-to-close transition. No bypass context
          # or repository-global current-project state is introduced here.
          gate_args=(
            python3 tests/ci/run_repository_gates.py
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --route-receipt target/quality-route.json
            --report target/repository-gates.json
            --gate-plan-bin target/release/ai-cockpit
          )
          if [[ -n "$ROUTE_CONTRACT_PATH" ]]; then
            gate_args+=(--contract-gate-report target/rust-contract-quality-gate.json)
          fi
          "${gate_args[@]}"
      - name: verify workspace package coverage receipt
        if: steps.quality_route.outputs.profile != 'light'
        shell: bash
        run: test -f target/workspace-package-coverage.json && test ! -L target/workspace-package-coverage.json
      - name: Cleanup hosted Runtime verification worktree
        if: always() && steps.quality_route.outputs.contract_path != ''
        shell: bash
        run: |
          set -euo pipefail
          tests/ci/cleanup_hosted_runtime_verification_worktree.sh \
            "$GITHUB_WORKSPACE" \
            target/hosted-runtime-worktree-cleanup.json
      - name: Upload hosted Work Item verification evidence
        if: always() && steps.quality_route.outputs.contract_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-hosted-runtime-verification
          path: |
            target/hosted-runtime-*.json
            target/hosted-runtime-*.stderr
          if-no-files-found: warn
          retention-days: 7
      - name: verify three-language work-item counterparts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r english; do
            test -f "${english%.md}.zh-CN.md"
            test -f "${english%.md}.ja.md"
          done < <(find docs/work-items -maxdepth 1 -name 'WI-*.md' ! -name '*.zh-CN.md' ! -name '*.ja.md' | sort)
      - name: upload deterministic gate receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: repository-gate-receipts
          path: |
            target/governance-integrity-report.json
            target/quality-route.json
            target/repository-gates.json
          if-no-files-found: error
          retention-days: 7
      - name: upload repository gate diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && hashFiles('target/repository-gate-diagnostics/*.log') != ''
        with:
          name: repository-gate-diagnostics
          path: target/repository-gate-diagnostics/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Upload Rust Contract gate receipt
        if: always() && steps.quality_route.outputs.contract_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-contract-quality-gate
          path: target/rust-contract-quality-gate.json
          if-no-files-found: error
          retention-days: 7
      - name: upload workspace package coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.quality_route.outputs.profile != 'light' && hashFiles('target/workspace-package-coverage.json') != ''
        with:
          name: workspace-package-coverage
          path: |
            target/workspace-package-coverage.json
          if-no-files-found: error
          retention-days: 7

  windows-runtime:
    needs: route
    if: needs.route.result == 'success' && needs.route.outputs.profile != 'light'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and tested revisions
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path target | Out-Null
          $testedRevision = (git rev-parse "$($env:GITHUB_SHA)^{commit}").Trim()
          $sourceRevision = $testedRevision
          if ($env:EVENT_NAME -eq 'pull_request') {
            $sourceRevision = $env:PR_HEAD_SHA
          }
          $testedParents = @(((git show -s --format=%P $testedRevision).Trim() -split '\s+') | Where-Object { $_ })
          $binding = [ordered]@{
            schemaVersion = 1
            kind = 'ci_revision_binding'
            eventName = $env:EVENT_NAME
            sourceHeadRevision = $sourceRevision
            routeHeadRevision = $sourceRevision
            testedRevision = $testedRevision
            testedParents = $testedParents
          }
          $binding | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 target/ci-revision-binding.json
          if ($env:EVENT_NAME -eq 'pull_request') {
            $resolvedSourceRevision = (git rev-parse "$($env:PR_HEAD_SHA)^{commit}").Trim()
            $expectedBase = (git rev-parse "$($env:PR_BASE_SHA)^{commit}").Trim()
            if ($testedParents.Count -ne 2 -or $testedParents[0] -ne $expectedBase -or $testedParents[1] -ne $resolvedSourceRevision) {
              throw 'tested PR merge commit does not bind the declared base and source head'
            }
          }
          if ((git cat-file -t $sourceRevision).Trim() -ne 'commit') {
            throw 'source head is not an available commit'
          }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: verify Windows agent adapter boundaries
        run: cargo test -p cockpit-agent --all-targets
      - name: verify Windows process and composition lifecycle boundaries
        run: cargo test --locked -p cockpit-verification --lib --test execution --test composition -- --test-threads=1
      - name: verify Windows repository boundaries
        run: cargo test -p cockpit-repository --test receipt_store --test verification_context --test verification_service
      - name: verify Windows directory-handle containment regressions
        run: cargo test --locked -p cockpit-repository --lib
      - name: verify Windows preflight lifecycle-lock admission
        run: cargo test --locked -p cockpit-mcp --test rpc runtime_preflight_waits_for_lifecycle_lock_and_rechecks_admission -- --exact
      - name: verify Windows governance-controls lifecycle-lock admission
        run: cargo test --locked -p cockpit-mcp --test rpc runtime_controls_wait_for_lifecycle_lock_and_recheck_admission_before_receipt_write -- --exact
      - name: upload Windows revision binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-revision-binding-windows
          path: target/ci-revision-binding.json
          if-no-files-found: warn
          retention-days: 7

  v1-behavioral-oracle:
    needs: route
    if: needs.route.result == 'success' && needs.route.outputs.profile != 'light'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: verify local-only reference-source policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/conformance/reference_source_policy.py \
            --lock tests/conformance/reference-source.lock
          bash tests/conformance/reference_source_policy_check.sh
      - name: compare Rust semantics with the committed offline corpus
        run: cargo test -p cockpit-core --test conformance -- --test-threads=1
