name: ai-cockpit quality

on:
  push:
    branches:
      - main
  pull_request:

# A newer commit for the same pull request supersedes the previous quality
# run. Main pushes are never cancelled by this PR-only policy, and release
# workflow truth has its own immutable concurrency boundary.
concurrency:
  group: ai-cockpit-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Compiler diagnostics are errors on every actual target, including build scripts.
env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  route:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.execute.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run canonical cheap prechecks before shared compilation
        shell: bash
        run: bash tests/ci/run_repository_prechecks.sh --repo "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: Plan the dynamic quality route
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_revision="$(git rev-parse "${PR_BASE_SHA}^{commit}")"
            head_revision="$(git rev-parse "${PR_HEAD_SHA}^{commit}")"
            stage=pull_request
          else
            stage=merge
          fi
          selector_args=(
            --repo "$GITHUB_WORKSPACE"
            --event "$EVENT_NAME"
            --head "$head_revision"
            --output target/quality-selection.json
          )
          if [[ "$EVENT_NAME" == pull_request ]]; then
            selector_args+=(--pr-head-ref "$PR_HEAD_REF" --pr-url "$PR_URL")
          fi
          tests/ci/resolve_work_item.sh "${selector_args[@]}"
          contract_path="$(jq -r '.contractPath // empty' target/quality-selection.json)"
          if [[ "$EVENT_NAME" != pull_request ]]; then
            # Ordinary merge routes intentionally have no Contract/base
            # identity after a Work Item has been archived before its PR is
            # reviewed. The typed route computes the repository base below.
            base_revision="$(jq -r '.baseRevision // empty' target/quality-selection.json)"
          fi
          echo "selection_method=$(jq -er '.selectionMethod' target/quality-selection.json)" >> "$GITHUB_OUTPUT"
          echo "work_item_id=$(jq -r '.workItemId // empty' target/quality-selection.json)" >> "$GITHUB_OUTPUT"
          echo "base_revision=$base_revision" >> "$GITHUB_OUTPUT"
          echo "head_revision=$head_revision" >> "$GITHUB_OUTPUT"
      - name: Build the shared Rust gate-plan tool once
        run: python3 tests/ci/run_no_warnings.py -- cargo build --locked --package cockpit-cli --release
      - name: Execute the dynamic quality route
        id: execute
        shell: bash
        env:
          ROUTE_BASE_REVISION: ${{ steps.plan.outputs.base_revision }}
          ROUTE_HEAD_REVISION: ${{ steps.plan.outputs.head_revision }}
        run: |
          set -euo pipefail
          head_revision="$ROUTE_HEAD_REVISION"
          base_revision="$ROUTE_BASE_REVISION"
          stage=pull_request
          [[ "$GITHUB_EVENT_NAME" == pull_request ]] || stage=merge
          route_args=(
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --base "${base_revision:-$(git rev-parse "${head_revision}^")}"
            --head "$head_revision"
            --stage "$stage"
            --risk normal
            --receipt target/quality-route.json
          )
          contract_path="$(jq -r '.contractPath // empty' target/quality-selection.json)"
          [[ -n "$contract_path" ]] && route_args+=(--contract "$contract_path")
          python3 tests/ci/quality_route.py "${route_args[@]}" --rust-bin target/release/ai-cockpit >/dev/null
          echo "profile=$(jq -er '.selectedProfile' target/quality-route.json)" >> "$GITHUB_OUTPUT"
      - name: Upload the shared Rust gate-plan tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-gate-plan-tool
          path: |
            target/release/ai-cockpit
            target/quality-selection.json
            target/quality-route.json
          if-no-files-found: error
          retention-days: 7

  quality:
    needs: route
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Download the shared Rust gate-plan tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-gate-plan-tool
          path: target/ci-gate-plan-download
          # Replace the dependency's deprecated Buffer-based ZIP extraction.
          # The pinned action still verifies the original archive digest.
          skip-decompress: true
          digest-mismatch: error
      - name: Extract the exact shared gate-plan files without deprecated dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import stat
          import zipfile
          downloads = list(Path('target/ci-gate-plan-download').iterdir())
          if len(downloads) != 1 or downloads[0].is_symlink() or not downloads[0].is_file():
              raise SystemExit('one regular downloaded gate-plan archive is required')
          expected = {'release/ai-cockpit', 'quality-selection.json', 'quality-route.json'}
          with zipfile.ZipFile(downloads[0]) as archive:
              entries = archive.infolist()
              files = [entry for entry in entries if not entry.is_dir()]
              if len(files) != len(expected) or {entry.filename for entry in files} != expected:
                  raise SystemExit('gate-plan archive file identities do not match')
              if any(stat.S_ISLNK(entry.external_attr >> 16) for entry in entries):
                  raise SystemExit('gate-plan archive contains a symbolic link')
              if archive.testzip() is not None:
                  raise SystemExit('gate-plan archive checksum failed')
              for entry in files:
                  path = Path('target') / entry.filename
                  path.parent.mkdir(parents=True, exist_ok=True)
                  if path.is_symlink() or path.parent.is_symlink():
                      raise SystemExit('gate-plan destination must not be a symlink')
                  path.write_bytes(archive.read(entry))
          PY
      - name: Make the shared Rust gate-plan tool executable
        run: chmod +x target/release/ai-cockpit
      - name: Bind source and tested revisions; validate the shared typed quality route
        id: quality_route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tested_revision="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          checkout_revision="$(git rev-parse HEAD)"
          test "$tested_revision" = "$checkout_revision" || {
            echo 'checked-out commit does not match GITHUB_SHA' >&2
            exit 1
          }
          source_revision="$tested_revision"
          event_base_revision=""
          tested_base_revision=""
          tested_parents_text="$(git show -s --format=%P "$tested_revision")"
          read -r -a tested_parents <<<"$tested_parents_text"
          tested_base_revision="${tested_parents[0]:-}"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            jq -e '.pull_request | type == "object" and (.base.sha | type == "string") and (.head.sha | type == "string")' "$GITHUB_EVENT_PATH" >/dev/null || {
              echo 'GitHub event payload does not contain a pull_request base and head' >&2
              exit 1
            }
            event_base_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            event_head_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            test "$PR_BASE_SHA" = "$event_base_sha" || {
              echo 'PR base context does not match the trusted event payload' >&2
              exit 1
            }
            test "$PR_HEAD_SHA" = "$event_head_sha" || {
              echo 'PR head context does not match the trusted event payload' >&2
              exit 1
            }
            [[ "$event_base_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$event_head_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || {
              echo 'pull_request event base and head must be full commit IDs' >&2
              exit 1
            }
            event_base_revision="$(git rev-parse --verify "${event_base_sha}^{commit}")"
            source_revision="$(git rev-parse --verify "${event_head_sha}^{commit}")"
          fi
          receipt_head="$(jq -r '.headRevision // empty' target/quality-route.json 2>/dev/null || true)"
          tested_parents_json="$(printf '%s\n' "${tested_parents[@]:-}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          jq -n \
            --arg eventName "$EVENT_NAME" \
            --arg sourceHeadRevision "$source_revision" \
            --arg routeHeadRevision "$receipt_head" \
            --arg testedRevision "$tested_revision" \
            --arg eventBaseRevision "$event_base_revision" \
            --arg testedBaseRevision "$tested_base_revision" \
            --argjson testedParents "$tested_parents_json" \
            '{schemaVersion:1,kind:"ci_revision_binding",eventName:$eventName,sourceHeadRevision:$sourceHeadRevision,routeHeadRevision:$routeHeadRevision,testedRevision:$testedRevision,eventBaseRevision:$eventBaseRevision,testedBaseRevision:$testedBaseRevision,testedParents:$testedParents}' \
            > target/ci-revision-binding.json
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if [[ "${#tested_parents[@]}" -ne 2 ]]; then
              echo 'tested PR merge commit must have exactly two parents' >&2
              exit 1
            fi
            test "${tested_parents[1]}" = "$source_revision" || {
              echo 'tested PR merge commit does not bind the declared source head' >&2
              exit 1
            }
            git merge-base --is-ancestor "$event_base_revision" "$tested_base_revision" || {
              echo 'declared event base is not an ancestor of the tested base revision' >&2
              exit 1
            }
          fi
          expected_stage=pull_request
          [[ "$EVENT_NAME" == pull_request ]] || expected_stage=merge
          receipt_stage="$(jq -er '.stage' target/quality-route.json)"
          test "$receipt_head" = "$source_revision" || {
            echo 'quality route receipt is bound to a different source revision' >&2
            exit 1
          }
          if [[ "$EVENT_NAME" != pull_request ]]; then
            test "$tested_revision" = "$source_revision"
          fi
          test "$receipt_stage" = "$expected_stage" || {
            echo 'quality route receipt is bound to a different event stage' >&2
            exit 1
          }
          contract_path="$(jq -r '.contractPath // empty' target/quality-route.json)"
          if [[ -n "$contract_path" ]]; then test -f "$contract_path"; fi
          selection_method="$(jq -er '.selectionMethod' target/quality-selection.json)"
          selection_contract_path="$(jq -r '.contractPath // empty' target/quality-selection.json)"
          test "$selection_contract_path" = "$contract_path" || {
            echo 'quality selection and typed route disagree on Contract path' >&2
            exit 1
          }
          active_contract='^\.ai/work-items/active/[^/]+\.contract\.json$'
          archived_contract='^\.ai/work-items/archive/[^/]+\.contract\.json$'
          case "$selection_method" in
            pull_request_binding|pull_request_branch_work_item)
              [[ "$EVENT_NAME" == pull_request && "$contract_path" =~ $active_contract ]] || exit 1
              lane=active
              ;;
            merged_pull_request_binding)
              [[ "$EVENT_NAME" == push && "$contract_path" =~ $active_contract ]] || exit 1
              lane=active
              ;;
            archived_contract_read_only)
              [[ "$EVENT_NAME" == pull_request && "$contract_path" =~ $archived_contract ]] || exit 1
              lane=archived
              ;;
            ordinary_repository_route)
              [[ -z "$contract_path" ]] || exit 1
              lane=ordinary
              ;;
            *)
              echo 'unsupported quality selection method' >&2
              exit 1
              ;;
          esac
          echo "profile=$(jq -er '.selectedProfile' target/quality-route.json)" >> "$GITHUB_OUTPUT"
          echo "base_revision=$(jq -er '.baseRevision' target/quality-route.json)" >> "$GITHUB_OUTPUT"
          echo "head_revision=$receipt_head" >> "$GITHUB_OUTPUT"
          echo "tested_revision=$tested_revision" >> "$GITHUB_OUTPUT"
          echo "stage=$receipt_stage" >> "$GITHUB_OUTPUT"
          echo "contract_path=$contract_path" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
      - name: Upload quality revision binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-quality-revision-binding
          path: target/ci-revision-binding.json
          if-no-files-found: warn
          retention-days: 7
      - name: verify immutable Runtime shadow
        if: steps.quality_route.outputs.profile != 'light' && steps.quality_route.outputs.contract_path != ''
        shell: bash
        run: bash tests/ci/runtime_verify_shadow.sh "$GITHUB_WORKSPACE" target/ci-runtime-verify-shadow.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.quality_route.outputs.profile != 'light' && steps.quality_route.outputs.contract_path != ''
        with:
          name: ci-runtime-verify-shadow
          path: target/ci-runtime-verify-shadow.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify the route plan is stable across jobs
        shell: bash
        env:
          ROUTE_PROFILE_FROM_PLAN: ${{ needs.route.outputs.profile }}
        run: |
          set -euo pipefail
          test "$(jq -er '.selectedProfile' target/quality-route.json)" = "$ROUTE_PROFILE_FROM_PLAN"
      - name: Run admitted hosted Work Item verification with the candidate Runtime
        if: steps.quality_route.outputs.lane == 'active'
        shell: bash
        env:
          ROUTE_CONTRACT_PATH: ${{ steps.quality_route.outputs.contract_path }}
          AI_COCKPIT_DEFER_WORKTREE_CLEANUP: ${{ steps.quality_route.outputs.profile != 'light' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/tests/ci/run_process_observer_test_runner.sh
        run: |
          set -euo pipefail
          caller_args=()
          if [[ "$(jq -er '.workItemId' "$ROUTE_CONTRACT_PATH")" == WI-1113-delivery-continuity-parallel-authorization ]]; then
            caller_file="$RUNNER_TEMP/wi1113-task-caller.json"
            (
              umask 077
              cat >"$caller_file" <<'TASK_CALLER_JSON'
          {
            "schemaVersion": 1,
            "actor": "agent:codex",
            "authoritySource": "conversation:Sentinel_536af122cd648191b5c75a93b2e7946e (user approval at 2026-10-26T20:00:00Z of the seven bounded WI-1113 boundaries; exact native confirm_review remains required; no other Work Item inherits this grant); conversation:Sentinel_ed78413b9a2481919b1183f668f93237 (user approval at 2026-10-27 01:43 UTC for WI-1113 main-target delivery and exactly the four-file self-declared caller transport scope, preflight/verify only, no permission increase; existing checks, review, and five-run CI budget remain). conversation:Sentinel_cf58ba2fa5648191a7c3283b391c7460 (user approval at 2026-10-28 03:47 UTC to raise the total WI-1113 hosted CI cap to ten runs as needed, without resetting prior runs); conversation:Sentinel_37dc204102f88191b0995fc665e9dc90 (user approval at 2026-10-28 04:29 UTC for task/pr/merge verification stage binding and synchronization of the previously approved ten-run cap, with checks and approvals preserved). conversation:Sentinel_a075cc7351108191bde4ab8f7111ced0 (user approval at 2026-10-28 07:24 UTC to raise the total WI-1113 hosted CI cap to fifteen runs, retaining all seven already-used runs and prior attempts, and synchronize the CI caller input; fifteen is the total cap, not additional runs). conversation:Sentinel_ada28e5329d48191ae30cb4f79073a4c (user approval at 2026-10-29 00:36 UTC to raise the total WI-1113 hosted CI cap from fifteen to twenty only if CI12 does not pass; retain all twelve already-used runs and prior attempts without resetting counts; synchronize the current Contract and CI caller, without weakening checks, assertions, authority or retry limits). conversation:Sentinel_2a6ab6cb93908191bb1325608daa4061 (user reminder at 2026-10-29 01:19 UTC that the raised CI budget must also be synchronized into the actual CI scripts).",
            "assurance": "self_declared"
          }
          TASK_CALLER_JSON
            )
            caller_args=(--task-caller "$caller_file")
          fi
          tests/ci/run_hosted_runtime_verification.sh \
            target/release/ai-cockpit \
            "$GITHUB_WORKSPACE" \
            "$ROUTE_CONTRACT_PATH" \
            target \
            "${caller_args[@]}"
      - name: Evaluate Rust Contract-aware quality gate
        if: steps.quality_route.outputs.contract_path != ''
        shell: bash
        env:
          ROUTE_BASE_REVISION: ${{ steps.quality_route.outputs.base_revision }}
          ROUTE_CONTRACT_PATH: ${{ steps.quality_route.outputs.contract_path }}
          ROUTE_STAGE: ${{ steps.quality_route.outputs.stage }}
        run: |
          set -euo pipefail
          contract_path="$ROUTE_CONTRACT_PATH"
          if [[ -n "$contract_path" && "$contract_path" != /* ]]; then
            contract_path="$GITHUB_WORKSPACE/$contract_path"
          fi
          target/release/ai-cockpit \
            gate \
            --repo "$GITHUB_WORKSPACE" \
            --contract "$contract_path" \
            --stage "$ROUTE_STAGE" \
            --runner hosted \
            --base-revision "$ROUTE_BASE_REVISION" \
            --report "$GITHUB_WORKSPACE/target/rust-contract-quality-gate.json"
      - name: Build legacy Runtime for coordination compatibility
        if: steps.quality_route.outputs.profile != 'light'
        shell: bash
        env:
          LEGACY_RUNTIME_SHA: 73f8bd2b86338f8025ef12ba9fff15bf45ef5782
        run: |
          set -euo pipefail
          legacy_parent="$(mktemp -d "$RUNNER_TEMP/ai-cockpit-legacy.XXXXXX")"
          legacy_source="$legacy_parent/source"
          cleanup() {
            git worktree remove --force "$legacy_source" >/dev/null 2>&1 || true
            rmdir "$legacy_parent" 2>/dev/null || true
          }
          trap cleanup EXIT
          git worktree add --detach "$legacy_source" "$LEGACY_RUNTIME_SHA"
          python3 tests/ci/run_no_warnings.py -- cargo build --locked --release \
            --manifest-path "$legacy_source/Cargo.toml" \
            --target-dir "$GITHUB_WORKSPACE/target/legacy-runtime" \
            -p cockpit-cli --bin ai-cockpit
          test -x "$GITHUB_WORKSPACE/target/legacy-runtime/release/ai-cockpit"
      - name: run repository gates exactly once
        shell: bash
        env:
          ROUTE_LANE: ${{ steps.quality_route.outputs.lane }}
          ROUTE_CONTRACT_PATH: ${{ steps.quality_route.outputs.contract_path }}
          ROUTE_PROFILE: ${{ steps.quality_route.outputs.profile }}
          AI_COCKPIT_VERIFICATION_RECEIPT: ${{ steps.quality_route.outputs.lane == 'active' && 'target/hosted-runtime-verification.json' || '' }}
          AI_COCKPIT_VERIFICATION_ORCHESTRATION: ${{ steps.quality_route.outputs.lane == 'active' && 'target/hosted-runtime-orchestration.json' || '' }}
          AI_COCKPIT_RUNTIME_BIN: target/release/ai-cockpit
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/tests/ci/run_process_observer_test_runner.sh
        run: |
          set -euo pipefail
          verification_repository="$GITHUB_WORKSPACE"
          if [[ "$ROUTE_LANE" == active ]]; then
            verification_repository=$(tests/ci/cleanup_hosted_runtime_verification_worktree.sh \
              --resolve "$GITHUB_WORKSPACE" target/hosted-runtime-worktree-cleanup.json)
          fi
          export AI_COCKPIT_VERIFICATION_REPOSITORY="$verification_repository"
          # The gate consumes GitHub's immutable push/PR context
          # (GITHUB_EVENT_NAME, GITHUB_REF, GITHUB_SHA) to recognize only the
          # bounded post-merge archive-to-close transition. No bypass context
          # or repository-global current-project state is introduced here.
          gate_args=(
            python3 tests/ci/run_repository_gates.py
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --route-receipt target/quality-route.json
            --report target/repository-gates.json
            --gate-plan-bin target/release/ai-cockpit
          )
          if [[ -n "$ROUTE_CONTRACT_PATH" ]]; then
            gate_args+=(--contract-gate-report target/rust-contract-quality-gate.json)
          fi
          "${gate_args[@]}"
      - name: verify workspace package coverage receipt
        if: steps.quality_route.outputs.profile != 'light'
        shell: bash
        run: test -f target/workspace-package-coverage.json && test ! -L target/workspace-package-coverage.json
      - name: Cleanup hosted Runtime verification worktree
        if: always() && steps.quality_route.outputs.lane == 'active'
        shell: bash
        run: |
          set -euo pipefail
          tests/ci/cleanup_hosted_runtime_verification_worktree.sh \
            "$GITHUB_WORKSPACE" \
            target/hosted-runtime-worktree-cleanup.json
      - name: Upload hosted Work Item verification evidence
        if: always() && steps.quality_route.outputs.lane == 'active'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-hosted-runtime-verification
          path: |
            target/hosted-runtime-*.json
            target/hosted-runtime-*.stderr
          if-no-files-found: warn
          retention-days: 7
      - name: verify three-language work-item counterparts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r english; do
            test -f "${english%.md}.zh-CN.md"
            test -f "${english%.md}.ja.md"
          done < <(find docs/work-items -maxdepth 1 -name 'WI-*.md' ! -name '*.zh-CN.md' ! -name '*.ja.md' | sort)
      - name: upload deterministic gate receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: repository-gate-receipts
          path: |
            target/governance-integrity-report.json
            target/quality-route.json
            target/repository-gates.json
          if-no-files-found: error
          retention-days: 7
      - name: upload repository gate diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && hashFiles('target/repository-gate-diagnostics/*.log') != ''
        with:
          name: repository-gate-diagnostics
          path: target/repository-gate-diagnostics/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Upload Rust Contract gate receipt
        if: always() && steps.quality_route.outputs.contract_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-contract-quality-gate
          path: target/rust-contract-quality-gate.json
          if-no-files-found: error
          retention-days: 7
      - name: upload workspace package coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.quality_route.outputs.profile != 'light' && hashFiles('target/workspace-package-coverage.json') != ''
        with:
          name: workspace-package-coverage
          path: |
            target/workspace-package-coverage.json
          if-no-files-found: error
          retention-days: 7

  windows-runtime-suites:
    needs: route
    if: needs.route.result == 'success' && needs.route.outputs.profile != 'light'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [boundaries, repository-library]
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and tested revisions
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path target | Out-Null
          function Invoke-GitText {
            param([string]$Repository, [string[]]$Arguments)
            $output = & git -C $Repository @Arguments 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "git command failed: $($Arguments -join ' ') ($($output -join ' '))"
            }
            return [string]::Join("`n", @($output)).Trim()
          }
          function Resolve-GitCommit {
            param([string]$Repository, [string]$Revision)
            if ($Revision -notmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') {
              throw 'pull_request event base and head must be full commit IDs'
            }
            return Invoke-GitText -Repository $Repository -Arguments @('rev-parse', '--verify', "$Revision^{commit}")
          }
          function Get-CiRevisionBinding {
            param(
              [string]$Repository,
              [string]$EventName,
              [string]$GithubSha,
              [string]$EventPath,
              [string]$PrHeadSha,
              [string]$PrBaseSha,
              [string]$BindingPath
            )
            $testedRevision = Resolve-GitCommit -Repository $Repository -Revision $GithubSha
            $checkoutRevision = Invoke-GitText -Repository $Repository -Arguments @('rev-parse', 'HEAD')
            $parentText = Invoke-GitText -Repository $Repository -Arguments @('show', '-s', '--format=%P', $testedRevision)
            $testedParents = @($parentText -split '\s+' | Where-Object { $_ })
            $testedBaseRevision = ''
            if ($testedParents.Count -gt 0) { $testedBaseRevision = $testedParents[0] }
            $eventBaseRevision = ''
            $sourceRevision = $testedRevision
            if ($EventName -eq 'pull_request') {
              if (-not (Test-Path -LiteralPath $EventPath)) {
                throw 'GitHub event payload is unavailable for pull_request binding'
              }
              $eventPayload = Get-Content -LiteralPath $EventPath -Raw | ConvertFrom-Json
              $pullRequest = $eventPayload.pull_request
              if ($null -eq $pullRequest -or $null -eq $pullRequest.base -or $null -eq $pullRequest.head) {
                throw 'GitHub event payload does not contain a pull_request base and head'
              }
              $eventBaseSha = [string]$pullRequest.base.sha
              $eventHeadSha = [string]$pullRequest.head.sha
              if ($PrBaseSha -ne $eventBaseSha) {
                throw 'PR base context does not match the trusted event payload'
              }
              if ($PrHeadSha -ne $eventHeadSha) {
                throw 'PR head context does not match the trusted event payload'
              }
              $eventBaseRevision = Resolve-GitCommit -Repository $Repository -Revision $eventBaseSha
              $sourceRevision = Resolve-GitCommit -Repository $Repository -Revision $eventHeadSha
            }
            $binding = [ordered]@{
              schemaVersion = 1
              kind = 'ci_revision_binding'
              eventName = $EventName
              sourceHeadRevision = $sourceRevision
              routeHeadRevision = $sourceRevision
              testedRevision = $testedRevision
              eventBaseRevision = $eventBaseRevision
              testedBaseRevision = $testedBaseRevision
              testedParents = $testedParents
            }
            if ($BindingPath) {
              $binding | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 -LiteralPath $BindingPath
            }
            if ($testedRevision -ne $checkoutRevision) {
              throw 'checked-out commit does not match GITHUB_SHA'
            }
            if ($EventName -eq 'pull_request') {
              if ($testedParents.Count -ne 2) {
                throw 'tested PR merge commit must have exactly two parents'
              }
              if ($testedParents[1] -ne $sourceRevision) {
                throw 'tested PR merge commit does not bind the declared source head'
              }
              & git -C $Repository merge-base --is-ancestor $eventBaseRevision $testedBaseRevision 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw 'declared event base is not an ancestor of the tested base revision'
              }
            }
            return $binding
          }
          function Write-TestPullRequestEvent {
            param([string]$Path, [string]$Base, [string]$Head)
            $payload = [ordered]@{
              pull_request = [ordered]@{
                base = [ordered]@{ sha = $Base }
                head = [ordered]@{ sha = $Head }
              }
            }
            $payload | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 -LiteralPath $Path
          }
          function Assert-CiRevisionBindingRejected {
            param(
              [string]$CaseName,
              [string]$Repository,
              [string]$EventPath,
              [string]$CheckoutRevision,
              [string]$GithubSha,
              [string]$EventBase,
              [string]$EventHead,
              [string]$ContextBase,
              [string]$ContextHead,
              [string]$ExpectedMessage
            )
            $null = Invoke-GitText -Repository $Repository -Arguments @('checkout', '--detach', $CheckoutRevision)
            Write-TestPullRequestEvent -Path $EventPath -Base $EventBase -Head $EventHead
            try {
              $null = Get-CiRevisionBinding -Repository $Repository -EventName 'pull_request' -GithubSha $GithubSha -EventPath $EventPath -PrBaseSha $ContextBase -PrHeadSha $ContextHead
            } catch {
              if ($_.Exception.Message -like "*$ExpectedMessage*") { return }
              throw
            }
            throw "Windows binding test accepted invalid case: $CaseName"
          }
          function Test-CiRevisionBindingCases {
            $testRoot = Join-Path $env:RUNNER_TEMP ("ci-revision-binding-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
            try {
              $repository = Join-Path $testRoot 'repo'
              New-Item -ItemType Directory -Force -Path $repository | Out-Null
              $null = Invoke-GitText -Repository $repository -Arguments @('init', '-q', '-b', 'main')
              $null = Invoke-GitText -Repository $repository -Arguments @('config', 'user.name', 'CI Revision Binding Test')
              $null = Invoke-GitText -Repository $repository -Arguments @('config', 'user.email', 'ci-revision@example.invalid')
              Set-Content -LiteralPath (Join-Path $repository 'README.txt') -Value 'base' -NoNewline
              $null = Invoke-GitText -Repository $repository -Arguments @('add', 'README.txt')
              $null = Invoke-GitText -Repository $repository -Arguments @('commit', '-q', '-m', 'event base')
              $eventBase = Invoke-GitText -Repository $repository -Arguments @('rev-parse', 'HEAD')
              $null = Invoke-GitText -Repository $repository -Arguments @('switch', '-q', '-c', 'feature')
              Set-Content -LiteralPath (Join-Path $repository 'feature.txt') -Value 'feature' -NoNewline
              $null = Invoke-GitText -Repository $repository -Arguments @('add', 'feature.txt')
              $null = Invoke-GitText -Repository $repository -Arguments @('commit', '-q', '-m', 'PR head')
              $sourceHead = Invoke-GitText -Repository $repository -Arguments @('rev-parse', 'HEAD')
              $null = Invoke-GitText -Repository $repository -Arguments @('switch', '-q', '-c', 'alternate', $eventBase)
              Set-Content -LiteralPath (Join-Path $repository 'alternate.txt') -Value 'alternate' -NoNewline
              $null = Invoke-GitText -Repository $repository -Arguments @('add', 'alternate.txt')
              $null = Invoke-GitText -Repository $repository -Arguments @('commit', '-q', '-m', 'alternate PR head')
              $alternateHead = Invoke-GitText -Repository $repository -Arguments @('rev-parse', 'HEAD')
              $null = Invoke-GitText -Repository $repository -Arguments @('switch', '-q', 'main')
              Set-Content -LiteralPath (Join-Path $repository 'main.txt') -Value 'advance main' -NoNewline
              $null = Invoke-GitText -Repository $repository -Arguments @('add', 'main.txt')
              $null = Invoke-GitText -Repository $repository -Arguments @('commit', '-q', '-m', 'advance main after event')
              $testedBase = Invoke-GitText -Repository $repository -Arguments @('rev-parse', 'HEAD')
              $null = Invoke-GitText -Repository $repository -Arguments @('merge', '--no-ff', '-q', '-m', 'synthetic PR merge', 'feature')
              $testedMerge = Invoke-GitText -Repository $repository -Arguments @('rev-parse', 'HEAD')
              $mergeTree = Invoke-GitText -Repository $repository -Arguments @('rev-parse', 'HEAD^{tree}')
              $wrongHeadMerge = Invoke-GitText -Repository $repository -Arguments @('commit-tree', $mergeTree, '-p', $testedBase, '-p', $alternateHead, '-m', 'wrong PR head')
              $threeParentMerge = Invoke-GitText -Repository $repository -Arguments @('commit-tree', $mergeTree, '-p', $testedBase, '-p', $sourceHead, '-p', $alternateHead, '-m', 'three-parent merge')
              $unrelatedBase = Invoke-GitText -Repository $repository -Arguments @('commit-tree', $mergeTree, '-m', 'unrelated event base')
              $eventPath = Join-Path $testRoot 'pull-request-event.json'
              Write-TestPullRequestEvent -Path $eventPath -Base $eventBase -Head $sourceHead
              $valid = Get-CiRevisionBinding -Repository $repository -EventName 'pull_request' -GithubSha $testedMerge -EventPath $eventPath -PrBaseSha $eventBase -PrHeadSha $sourceHead
              if ($valid.eventBaseRevision -ne $eventBase -or $valid.testedBaseRevision -ne $testedBase) {
                throw 'stale event base did not preserve eventBaseRevision and testedBaseRevision separately'
              }
              Assert-CiRevisionBindingRejected -CaseName 'caller-supplied base' -Repository $repository -EventPath $eventPath -CheckoutRevision $testedMerge -GithubSha $testedMerge -EventBase $eventBase -EventHead $sourceHead -ContextBase $testedBase -ContextHead $sourceHead -ExpectedMessage 'PR base context does not match the trusted event payload'
              Assert-CiRevisionBindingRejected -CaseName 'non-ancestor event base' -Repository $repository -EventPath $eventPath -CheckoutRevision $testedMerge -GithubSha $testedMerge -EventBase $unrelatedBase -EventHead $sourceHead -ContextBase $unrelatedBase -ContextHead $sourceHead -ExpectedMessage 'declared event base is not an ancestor of the tested base revision'
              Assert-CiRevisionBindingRejected -CaseName 'wrong PR head' -Repository $repository -EventPath $eventPath -CheckoutRevision $testedMerge -GithubSha $testedMerge -EventBase $eventBase -EventHead $alternateHead -ContextBase $eventBase -ContextHead $alternateHead -ExpectedMessage 'tested PR merge commit does not bind the declared source head'
              Assert-CiRevisionBindingRejected -CaseName 'checkout/GITHUB_SHA mismatch' -Repository $repository -EventPath $eventPath -CheckoutRevision $testedMerge -GithubSha $sourceHead -EventBase $eventBase -EventHead $sourceHead -ContextBase $eventBase -ContextHead $sourceHead -ExpectedMessage 'checked-out commit does not match GITHUB_SHA'
              Assert-CiRevisionBindingRejected -CaseName 'one-parent commit' -Repository $repository -EventPath $eventPath -CheckoutRevision $sourceHead -GithubSha $sourceHead -EventBase $eventBase -EventHead $sourceHead -ContextBase $eventBase -ContextHead $sourceHead -ExpectedMessage 'tested PR merge commit must have exactly two parents'
              Assert-CiRevisionBindingRejected -CaseName 'three-parent commit' -Repository $repository -EventPath $eventPath -CheckoutRevision $threeParentMerge -GithubSha $threeParentMerge -EventBase $eventBase -EventHead $sourceHead -ContextBase $eventBase -ContextHead $sourceHead -ExpectedMessage 'tested PR merge commit must have exactly two parents'
              Assert-CiRevisionBindingRejected -CaseName 'wrong merge second parent' -Repository $repository -EventPath $eventPath -CheckoutRevision $wrongHeadMerge -GithubSha $wrongHeadMerge -EventBase $eventBase -EventHead $sourceHead -ContextBase $eventBase -ContextHead $sourceHead -ExpectedMessage 'tested PR merge commit does not bind the declared source head'
            } finally {
              Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $binding = Get-CiRevisionBinding -Repository $env:GITHUB_WORKSPACE -EventName $env:EVENT_NAME -GithubSha $env:GITHUB_SHA -EventPath $env:GITHUB_EVENT_PATH -PrHeadSha $env:PR_HEAD_SHA -PrBaseSha $env:PR_BASE_SHA -BindingPath 'target/ci-revision-binding.json'
          Test-CiRevisionBindingCases
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          components: clippy
      - name: verify Windows zero-warning workspace Clippy
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: verify Windows agent adapter boundaries
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test -p cockpit-agent --all-targets
      - name: verify Windows process and composition lifecycle boundaries
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-verification --lib --test execution --test composition -- --test-threads=1
      - name: verify Windows repository boundaries
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test -p cockpit-repository --test receipt_store --test verification_context --test verification_service
      - name: verify Windows bounded task authorization
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-repository --test task_authorization -- --test-threads=1
      - name: verify Windows task caller CLI and MCP parity
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-cli --test contract_amendment_processes explicit_task_caller_and_resumption_assessment_match_cli_and_mcp -- --exact --test-threads=1
      - name: verify Windows complete staged MCP start
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-mcp --test rpc mcp_staged_start_preserves_the_complete_plan_without_checkpointing -- --exact --test-threads=1
      - name: verify Windows directory-handle containment regressions
        if: matrix.suite == 'repository-library'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-repository --lib
      - name: verify Windows preflight lifecycle-lock admission
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-mcp --test rpc runtime_preflight_waits_for_lifecycle_lock_and_rechecks_admission -- --exact
      - name: verify Windows governance-controls lifecycle-lock admission
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-mcp --test rpc runtime_controls_wait_for_lifecycle_lock_and_recheck_admission_before_receipt_write -- --exact
      - name: verify Windows explicit cognitive evaluator binary failure modes
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-cli --test cognitive_benefit windows_invalid_regular_binary_fails_without_fallback_or_artifact_writes -- --exact
      - name: verify Windows cognitive evaluator native path parity
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-cli --test cognitive_benefit generated_json_and_markdown_match_python_in_an_isolated_checkout -- --exact
      - name: verify Windows cognitive evaluator read-only parity
        if: matrix.suite == 'boundaries'
        run: python tests/ci/run_no_warnings.py -- cargo test --locked -p cockpit-cli --test cognitive_benefit rust_check_matches_the_existing_python_gate_without_rewriting_evidence -- --exact
      - name: Record successful Windows suite
        shell: pwsh
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binding = Get-Content -LiteralPath 'target/ci-revision-binding.json' -Raw | ConvertFrom-Json
          $result = [ordered]@{
            schemaVersion = 1
            state = 'passed'
            suite = $env:SUITE
            repository = $env:GITHUB_REPOSITORY
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            binding = $binding
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -LiteralPath 'target/windows-suite-result.json'
      - name: upload Windows revision binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-revision-binding-windows-${{ matrix.suite }}
          path: |
            target/ci-revision-binding.json
            target/windows-suite-result.json
          if-no-files-found: warn
          retention-days: 7

  # Keep the existing required check name; a missing or failed suite cannot
  # be reported as success merely because one revision artifact was uploaded.
  windows-runtime:
    needs: [route, windows-runtime-suites]
    if: always() && (needs.route.result != 'success' || needs.route.outputs.profile != 'light')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require all Windows suite jobs to succeed
        env:
          SUITES_RESULT: ${{ needs.windows-runtime-suites.result }}
        run: test "$SUITES_RESULT" = success
      - name: Download exact Windows boundaries receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-revision-binding-windows-boundaries
          path: target/windows-results/boundaries
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact Windows repository-library receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-revision-binding-windows-repository-library
          path: target/windows-results/repository-library
          skip-decompress: true
          digest-mismatch: error
      - name: Verify complete same-run Windows suite receipts
        shell: bash
        env:
          SUITES_RESULT: ${{ needs.windows-runtime-suites.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import zipfile


          def require(condition, message):
              if not condition:
                  raise SystemExit(message)


          def full_revision(value):
              return isinstance(value, str) and re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", value)


          require(os.environ["SUITES_RESULT"] == "success", "Windows matrix did not complete successfully")
          suites = ("boundaries", "repository-library")
          tested = os.environ["GITHUB_SHA"]
          event = os.environ["EVENT_NAME"]
          require(event in ("push", "pull_request"), "unsupported Windows event")
          source = os.environ["PR_HEAD_SHA"] if event == "pull_request" else tested
          event_base = os.environ["PR_BASE_SHA"] if event == "pull_request" else ""
          require(full_revision(tested) and full_revision(source), "invalid trusted Windows revision context")
          if event == "pull_request":
              require(full_revision(event_base), "invalid trusted PR base")
          previous_binding = None
          for suite in suites:
              directory = Path("target/windows-results") / suite
              require(directory.is_dir() and not directory.is_symlink(), "missing Windows suite artifacts")
              downloads = list(directory.iterdir())
              require(len(downloads) == 1 and downloads[0].is_file() and not downloads[0].is_symlink(),
                      "one regular Windows suite archive is required")
              with zipfile.ZipFile(downloads[0]) as archive:
                  entries = archive.infolist()
                  names = {entry.filename for entry in entries}
                  require(len(entries) == 2 and names == {"ci-revision-binding.json", "windows-suite-result.json"},
                          "Windows suite archive identities differ")
                  require(all(not entry.is_dir() and not stat.S_ISLNK(entry.external_attr >> 16)
                              and entry.file_size <= 16384 for entry in entries), "unsafe Windows suite archive")
                  require(archive.testzip() is None, "Windows suite archive checksum failed")
                  binding = json.loads(archive.read("ci-revision-binding.json").decode("utf-8-sig"))
                  result = json.loads(archive.read("windows-suite-result.json").decode("utf-8-sig"))
              require(isinstance(result, dict) and isinstance(binding, dict), "invalid Windows suite records")
              require(result.get("schemaVersion") == 1 and result.get("state") == "passed"
                      and result.get("suite") == suite and result.get("binding") == binding,
                      "Windows suite completion or binding differs")
              require(result.get("repository") == os.environ["GITHUB_REPOSITORY"]
                      and result.get("runId") == os.environ["GITHUB_RUN_ID"]
                      and result.get("runAttempt") == os.environ["GITHUB_RUN_ATTEMPT"],
                      "Windows suite is from another repository, run or attempt")
              require(binding.get("schemaVersion") == 1 and binding.get("kind") == "ci_revision_binding"
                      and binding.get("eventName") == event and binding.get("testedRevision") == tested
                      and binding.get("sourceHeadRevision") == source and binding.get("routeHeadRevision") == source
                      and binding.get("eventBaseRevision") == event_base, "Windows source/tested/event binding differs")
              parents = binding.get("testedParents")
              require(isinstance(parents, list) and all(full_revision(parent) for parent in parents),
                      "invalid Windows parent lineage")
              require(binding.get("testedBaseRevision") == (parents[0] if parents else ""),
                      "Windows tested base does not match its parent")
              if event == "pull_request":
                  require(len(parents) == 2 and parents[1] == source, "Windows PR merge lineage differs")
              require(previous_binding is None or binding == previous_binding, "Windows suites tested different revisions")
              previous_binding = binding
          print("both Windows suites passed for this exact run, source and tested revision")
          PY

  v1-behavioral-oracle:
    needs: route
    if: needs.route.result == 'success' && needs.route.outputs.profile != 'light'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: verify local-only reference-source policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/conformance/reference_source_policy.py \
            --lock tests/conformance/reference-source.lock
          bash tests/conformance/reference_source_policy_check.sh
      - name: compare Rust semantics with the committed offline corpus
        run: python tests/ci/run_no_warnings.py -- cargo test -p cockpit-core --test conformance -- --test-threads=1
