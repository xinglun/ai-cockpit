name: ai-cockpit quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Keep workspace-level process-spawning tests deterministic under the
      # hosted runner. Tests that exercise the verifier's internal worker cap
      # still create their own parallel commands.
      - run: cargo test --workspace -- --test-threads=1
      - name: verify three-language work-item counterparts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r english; do
            test -f "${english%.md}.zh-CN.md"
            test -f "${english%.md}.ja.md"
          done < <(find docs/work-items -maxdepth 1 -name 'WI-*.md' ! -name '*.zh-CN.md' ! -name '*.ja.md' | sort)
      - name: verify release workflow policy
        run: tests/release/workflow_policy.sh .github/workflows/release.yml

  windows-runtime:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: verify Windows process and executable identity boundaries
        run: >-
          cargo test
          -p cockpit-verification --test execution
          -p cockpit-repository --test receipt_store --test verification_context --test verification_service

  v1-behavioral-oracle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: check out exact V1 behavioral oracle
        shell: bash
        run: |
          set -euo pipefail
          reference_commit="$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"$/\1/p' tests/conformance/v1-reference.lock)"
          test "${#reference_commit}" -eq 40
          git init -q target/v1-reference
          git -C target/v1-reference fetch --depth=1 \
            https://github.com/spirex-ds-dev/ai-cockpit-template.git "${reference_commit}"
          git -C target/v1-reference checkout -q --detach FETCH_HEAD
          test "$(git -C target/v1-reference rev-parse HEAD)" = "${reference_commit}"
      - name: compare Rust semantics with locked V1 runtime
        env:
          AI_COCKPIT_V1_ROOT: ${{ github.workspace }}/target/v1-reference
        run: cargo test -p cockpit-core --test v1_oracle -- --ignored --nocapture
