name: ai-cockpit quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: verify immutable Runtime shadow
        shell: bash
        run: bash tests/ci/runtime_verify_shadow.sh "$GITHUB_WORKSPACE" target/ci-runtime-verify-shadow.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-runtime-verify-shadow
          path: target/ci-runtime-verify-shadow.json
          if-no-files-found: error
          retention-days: 7
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Cargo can run separate package test binaries concurrently even when
      # each binary receives --test-threads=1. The repository tests spawn
      # short-lived child processes and must not share that process/descriptor
      # pressure with another package's test binary. The verifier's internal
      # worker-cap test still creates parallel commands inside its own binary.
      - name: run package tests serially
        shell: bash
        run: tests/ci/run_workspace_package_tests.sh --report target/workspace-package-coverage.json
      - name: run repository gates exactly once
        shell: bash
        run: >-
          python3 tests/ci/run_repository_gates.py
          --repo "$GITHUB_WORKSPACE"
          --manifest tests/ci/repository_gate_manifest.json
          --report target/repository-gates.json
      - name: verify three-language work-item counterparts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r english; do
            test -f "${english%.md}.zh-CN.md"
            test -f "${english%.md}.ja.md"
          done < <(find docs/work-items -maxdepth 1 -name 'WI-*.md' ! -name '*.zh-CN.md' ! -name '*.ja.md' | sort)
      - name: upload deterministic gate receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-gate-receipts
          path: |
            target/governance-integrity-report.json
            target/repository-gates.json
            target/workspace-package-coverage.json
          if-no-files-found: error
          retention-days: 7

  windows-runtime:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: verify Windows agent adapter boundaries
        run: cargo test -p cockpit-agent --all-targets
      - name: verify Windows process and executable identity boundaries
        run: cargo test -p cockpit-verification --test execution
      - name: verify Windows repository boundaries
        run: cargo test -p cockpit-repository --test receipt_store --test verification_context --test verification_service

  v1-behavioral-oracle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: check out exact V1 behavioral oracle
        shell: bash
        run: |
          set -euo pipefail
          reference_commit="$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"$/\1/p' tests/conformance/v1-reference.lock)"
          test "${#reference_commit}" -eq 40
          git init -q target/v1-reference
          git -C target/v1-reference fetch --depth=1 \
            https://github.com/spirex-ds-dev/ai-cockpit-template.git "${reference_commit}"
          git -C target/v1-reference checkout -q --detach FETCH_HEAD
          test "$(git -C target/v1-reference rev-parse HEAD)" = "${reference_commit}"
      - name: compare Rust semantics with locked V1 runtime
        env:
          AI_COCKPIT_V1_ROOT: ${{ github.workspace }}/target/v1-reference
        run: cargo test -p cockpit-core --test v1_oracle -- --ignored --nocapture
