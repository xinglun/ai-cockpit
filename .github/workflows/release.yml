name: ai-cockpit release evidence

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Published previous Release tag (vX.Y.Z)'
        required: true
        type: string
      to_tag:
        description: 'Published new Release tag (vX.Y.Z)'
        required: true
        type: string
      target:
        description: 'Rust target to exercise'
        required: false
        default: x86_64-unknown-linux-gnu
        type: string
      handoff_run_id:
        description: 'Completed publication run whose immutable handoff artifact must be consumed for manual acceptance'
        required: false
        type: string
      publish_existing_tag:
        description: 'Recover publication of an existing immutable tag after a failed tag-triggered run'
        required: false
        default: false
        type: boolean
      post_release_acceptance:
        description: 'Run post-release handoff, public install, upgrade, and close only; never rebuild or publish'
        required: false
        default: false
        type: boolean
      reuse_run_id:
        description: 'Prior release run with a successful Ubuntu release-helper stage to reuse for post-release acceptance'
        required: false
        type: string
      work_item_id:
        description: 'Active Work Item identity required for immutable-tag recovery'
        required: false
        type: string
      contract_path:
        description: 'Active Contract path alternative to work_item_id for recovery'
        required: false
        type: string
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: never

jobs:
  release_input_preflight:
    # This job is intentionally shell/jq-only. It rejects malformed release
    # input and unresolved Work Item identity before the Rust route tool or any
    # platform compiler is built. The formal Rust gate still owns governance
    # authorization after this cheap identity check succeeds.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      contract_path: ${{ steps.resolve.outputs.contract_path }}
      base_revision: ${{ steps.resolve.outputs.base_revision }}
      head_revision: ${{ steps.resolve.outputs.head_revision }}
      release_source_revision: ${{ steps.resolve.outputs.release_source_revision }}
      reuse_run_id: ${{ steps.resolve.outputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release identity before compilation
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FROM_TAG: ${{ github.event.inputs.from_tag }}
          INPUT_TO_TAG: ${{ github.event.inputs.to_tag }}
          INPUT_WORK_ITEM_ID: ${{ github.event.inputs.work_item_id }}
          INPUT_CONTRACT_PATH: ${{ github.event.inputs.contract_path }}
          INPUT_HANDOFF_RUN_ID: ${{ github.event.inputs.handoff_run_id }}
          PUBLISH_EXISTING_TAG: ${{ github.event.inputs.publish_existing_tag || 'false' }}
          INPUT_POST_RELEASE_ACCEPTANCE: ${{ github.event.inputs.post_release_acceptance || 'false' }}
          INPUT_REUSE_RUN_ID: ${{ github.event.inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          selector_args=(
            --repo "$GITHUB_WORKSPACE"
            --event "$EVENT_NAME"
            --head "$head_revision"
            --from-tag "$INPUT_FROM_TAG"
            --to-tag "$INPUT_TO_TAG"
            --publish-existing-tag "$PUBLISH_EXISTING_TAG"
            --post-release-acceptance "$INPUT_POST_RELEASE_ACCEPTANCE"
            --output target/release-input-preflight.json
          )
          if [[ -n "$INPUT_WORK_ITEM_ID" ]]; then
            selector_args+=(--work-item-id "$INPUT_WORK_ITEM_ID")
          fi
          if [[ -n "$INPUT_CONTRACT_PATH" ]]; then
            selector_args+=(--contract-path "$INPUT_CONTRACT_PATH")
          fi
          if [[ -n "$INPUT_HANDOFF_RUN_ID" ]]; then
            selector_args+=(--handoff-run-id "$INPUT_HANDOFF_RUN_ID")
          fi
          if [[ -n "$INPUT_REUSE_RUN_ID" ]]; then
            selector_args+=(--reuse-run-id "$INPUT_REUSE_RUN_ID")
          fi
          if [[ "$EVENT_NAME" == push ]]; then
            selector_args+=(--github-repository "$GITHUB_REPOSITORY")
          fi
          tests/ci/resolve_work_item.sh "${selector_args[@]}"
          echo "mode=$(jq -er '.mode' target/release-input-preflight.json)" >> "$GITHUB_OUTPUT"
          echo "contract_path=$(jq -r '.contractPath // empty' target/release-input-preflight.json)" >> "$GITHUB_OUTPUT"
          echo "base_revision=$(jq -r '.baseRevision // empty' target/release-input-preflight.json)" >> "$GITHUB_OUTPUT"
          echo "head_revision=$(jq -er '.headRevision' target/release-input-preflight.json)" >> "$GITHUB_OUTPUT"
          echo "release_source_revision=$(jq -r '.releaseSourceRevision // empty' target/release-input-preflight.json)" >> "$GITHUB_OUTPUT"
          echo "reuse_run_id=$(jq -r '.reuseRunId // empty' target/release-input-preflight.json)" >> "$GITHUB_OUTPUT"
      - name: Upload release input preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-input-preflight
          path: target/release-input-preflight.json
          if-no-files-found: warn
          retention-days: 7

  post_release_helper:
    # post-release-only recovery reuses a helper from a known successful run;
    # it never rebuilds the helper or depends on the failed publication graph.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true'
    needs: [release_input_preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate and restore the reusable release helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ github.event.inputs.reuse_run_id }}
          EXPECTED_MODE: ${{ needs.release_input_preflight.outputs.mode }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MODE" == post_release_acceptance ]] || {
            echo 'post-release helper requested outside post-release-only mode' >&2
            exit 1
          }
          [[ "$REUSE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'post-release-only recovery requires a numeric reuse_run_id' >&2
            exit 1
          }
          [[ "$REUSE_RUN_ID" != "$GITHUB_RUN_ID" ]] || {
            echo 'reuse_run_id must identify a prior workflow run, not the current run' >&2
            exit 1
          }
          run_info="$(gh run view "$REUSE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,event,workflowName,headSha,jobs)"
          jq -e '
            .workflowName == "ai-cockpit release evidence" and
            (.event == "push" or .event == "workflow_dispatch") and
            (.headSha | test("^[0-9a-f]{40}$")) and
            ([.jobs[] | select(.name | startswith("release_tools (ubuntu-24.04, ubuntu-x86_64, cockpit-release)")) | select(.conclusion == "success")] | length == 1)
          ' <<<"$run_info" >/dev/null || {
            echo 'reuse_run_id must identify a release workflow run with a successful Ubuntu release-tool job and valid execution identity' >&2
            exit 1
          }
          artifact_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and .name == "cockpit-release-tool-ubuntu-x86_64")] | sort_by(.created_at) | last.name // empty')"
          [[ "$artifact_name" == cockpit-release-tool-ubuntu-x86_64 ]] || {
            echo 'the requested reuse run has no unexpired Ubuntu release helper artifact' >&2
            exit 1
          }
          mkdir -p tools
          gh run download "$REUSE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir tools
          chmod +x tools/cockpit-release
          (cd tools && sha256sum -c cockpit-release.sha256)
          jq -n --arg runId "$REUSE_RUN_ID" --arg artifact "$artifact_name" \
            --arg workflowName "$(jq -er '.workflowName' <<<"$run_info")" \
            --arg headSha "$(jq -er '.headSha' <<<"$run_info")" \
            --arg releaseToolJob "$(jq -er '[.jobs[] | select(.name | startswith("release_tools (ubuntu-24.04, ubuntu-x86_64, cockpit-release)")) | select(.conclusion == "success") | .name][0]' <<<"$run_info")" \
            '{schemaVersion:1,kind:"post_release_helper_reuse",state:"reused",runId:$runId,artifact:$artifact,workflowName:$workflowName,headSha:$headSha,releaseToolJob:$releaseToolJob}' \
            > tools/post-release-helper.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-release-helper
          path: tools/
          if-no-files-found: error
          retention-days: 30

  release_tools:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    # Helper compilation is an expensive prerequisite; do not start it until
    # route preparation and the canonical source-quality gates have passed.
    needs: [release_preflight, source_quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: ubuntu-x86_64
            binary: cockpit-release
          - os: ubuntu-24.04-arm
            artifact: ubuntu-arm64
            binary: cockpit-release
          - os: macos-15-intel
            artifact: macos-x86_64
            binary: cockpit-release
          - os: macos-15
            artifact: macos-arm64
            binary: cockpit-release
          - os: windows-2025
            artifact: windows-x86_64
            binary: cockpit-release.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: Build the platform release helper once
        shell: bash
        env:
          HELPER_BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          cargo build --locked --release --package cockpit-release
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "target/release/$HELPER_BINARY" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "target/release/$HELPER_BINARY" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$digest" "$HELPER_BINARY" > target/release/cockpit-release.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: cockpit-release-tool-${{ matrix.artifact }}
          path: |
            target/release/${{ matrix.binary }}
            target/release/cockpit-release.sha256
          if-no-files-found: error
          retention-days: 7

  release_preflight:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: release_input_preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-input-preflight
          path: target
      # The canonical repository gates run exactly once in source_quality from
      # the typed route and manifest. This job only prepares that route before
      # any platform helper or source build can start.
      - name: Build the shared Rust route tool once
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package cockpit-cli
      - name: Plan the strict release quality route
        shell: bash
        env:
          PUBLISH_EXISTING_TAG: ${{ github.event.inputs.publish_existing_tag || 'false' }}
          INPUT_TO_TAG: ${{ github.event.inputs.to_tag }}
        run: |
          set -euo pipefail
          head_revision="$(jq -er '.headRevision' target/release-input-preflight.json)"
          base_revision="$(jq -er '.baseRevision // .headRevision' target/release-input-preflight.json)"
          contract_path="$(jq -r '.contractPath // empty' target/release-input-preflight.json)"
          route_args=(
            --repo "$GITHUB_WORKSPACE"
            --manifest tests/ci/repository_gate_manifest.json
            --base "$base_revision"
            --head "$head_revision"
            --stage release
            --risk high
            --profile strict
            --receipt target/release-quality-route.json
          )
          [[ -n "$contract_path" ]] && route_args+=(--contract "$contract_path")
          set +e
          target/release/ai-cockpit gate-plan "${route_args[@]}"
          result=$?
          set -e
          if [[ "$result" -ne 0 ]]; then
            jq -n --arg code release_quality_route_failed --argjson exitCode "$result" \
              '{schemaVersion:1,kind:"release_preflight_failure",state:"failed",failureCode:$code,exitCode:$exitCode}' \
              > target/release-preflight-failure.json
            exit "$result"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: release-preflight-receipts
          path: |
            target/governance-integrity-report.json
            target/release-quality-route.json
            target/release-preflight-failure.json
            target/release/ai-cockpit
          if-no-files-found: warn
          retention-days: 7

  build:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [release_preflight, source_quality, release_tools]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            helper_artifact: ubuntu-x86_64
            helper_binary: cockpit-release
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            helper_artifact: ubuntu-arm64
            helper_binary: cockpit-release
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            helper_artifact: macos-x86_64
            helper_binary: cockpit-release
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            helper_artifact: macos-arm64
            helper_binary: cockpit-release
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
            helper_artifact: windows-x86_64
            helper_binary: cockpit-release.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_existing_tag == 'true' || github.event.inputs.post_release_acceptance == 'true') && github.event.inputs.to_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cockpit-release-tool-${{ matrix.helper_artifact }}
          path: tools
      - name: Verify the prebuilt platform helper
        shell: bash
        env:
          HELPER_BINARY: ${{ matrix.helper_binary }}
        run: |
          set -euo pipefail
          chmod +x "tools/$HELPER_BINARY"
          expected="$(awk -v name="$HELPER_BINARY" '$2 == name {print $1}' tools/cockpit-release.sha256)"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "tools/$HELPER_BINARY" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "tools/$HELPER_BINARY" | awk '{print $1}')"
          fi
          test -n "$expected" && test "$expected" = "$actual"
      - name: Build the target binary
        run: cargo build --locked --release --package cockpit-cli --target ${{ matrix.target }}
      - name: Package the exact archive layout
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --format-version 1 | jq -er '.packages[] | select(.name == "cockpit-cli") | .version')"
          tag="v${version}"
          mkdir -p dist
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            executable="target/${TARGET}/release/ai-cockpit.exe"
            archive="dist/ai-cockpit-${tag}-${TARGET}.zip"
          else
            executable="target/${TARGET}/release/ai-cockpit"
            archive="dist/ai-cockpit-${tag}-${TARGET}.tar.gz"
          fi
          printf 'ai-cockpit %s archive for %s\n' "$version" "$TARGET" > dist/README
          tools/${{ matrix.helper_binary }} package \
            --executable "$executable" \
            --license LICENSE \
            --readme dist/README \
            --target "$TARGET" \
            --output "$archive"
          cargo metadata --locked --format-version 1 > "dist/ai-cockpit-${tag}-${TARGET}.cargo.json"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom-spdx-${{ matrix.target }}.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bind SBOM to the release version
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --format-version 1 | jq -er '.packages[] | select(.name == "cockpit-cli") | .version')"
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then extension=zip; else extension=tar.gz; fi
          archive="dist/ai-cockpit-v${version}-${TARGET}.${extension}"
          sbom="dist/ai-cockpit-v${version}-${TARGET}.spdx.json"
          mv "dist/sbom-spdx-${TARGET}.json" "$sbom"
          tools/${{ matrix.helper_binary }} bind-sbom \
            --sbom "$sbom" \
            --archive "$archive" \
            --target "$TARGET" \
            --version "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: ai-cockpit-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  source_quality:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: release_preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-preflight-receipts
          path: target
      - name: Verify the shared Rust gate tool
        shell: bash
        run: |
          set -euo pipefail
          chmod +x target/release/ai-cockpit
          test -x target/release/ai-cockpit
      - name: Evaluate Rust Contract-aware quality gate
        shell: bash
        run: |
          set -euo pipefail
          contract_path="$(jq -r '.contractPath // empty' target/release-quality-route.json)"
          profile="$(jq -er '.selectedProfile' target/release-quality-route.json)"
          if [[ "$profile" != light && -n "$contract_path" ]]; then
            target/release/ai-cockpit gate \
              --repo "$GITHUB_WORKSPACE" \
              --contract "$contract_path" \
              --stage release \
              --runner hosted \
              --base-revision "$(jq -er '.baseRevision' target/release-quality-route.json)" \
              --report target/rust-contract-quality-gate.json
          fi
      - name: Run source quality gates
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          version="$(jq -er '.packages[] | select(.name == "cockpit-cli") | .version' /tmp/cargo-metadata.json)"
          jq -e --arg version "$version" '[.packages[] | select(.source == null) | .version == $version] | all' /tmp/cargo-metadata.json
          gate_args=(
            python3 tests/ci/run_repository_gates.py \
            --repo "$GITHUB_WORKSPACE" \
            --manifest tests/ci/repository_gate_manifest.json \
            --route-receipt target/release-quality-route.json \
            --report target/repository-gates.json
          )
          gate_args+=(--gate-plan-bin target/release/ai-cockpit)
          contract_path="$(jq -r '.contractPath // empty' target/release-quality-route.json)"
          profile="$(jq -er '.selectedProfile' target/release-quality-route.json)"
          if [[ "$profile" != light && -n "$contract_path" ]]; then
            gate_args+=(--contract-gate-report target/rust-contract-quality-gate.json)
          fi
          "${gate_args[@]}"
      - name: Persist source quality failure evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p target
          jq -n --arg code source_quality_failed \
            '{schemaVersion:1,kind:"release_source_quality_failure",state:"failed",failureCode:$code}' \
            > target/release-source-quality-failure.json
      - name: Upload source gate receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: source-gate-receipts
          path: |
            target/governance-integrity-report.json
            target/release-quality-route.json
            target/repository-gates.json
            target/workspace-package-coverage.json
            target/release-source-quality-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Rust Contract gate receipt
        if: hashFiles('target/rust-contract-quality-gate.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: rust-contract-quality-gate
          path: target/rust-contract-quality-gate.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [build, release_tools]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_existing_tag == 'true' || github.event.inputs.post_release_acceptance == 'true') && github.event.inputs.to_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: ai-cockpit-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - name: Aggregate and bind the candidate
        shell: bash
        env:
          PUBLISH_EXISTING_TAG: ${{ github.event.inputs.publish_existing_tag || 'false' }}
          INPUT_TO_TAG: ${{ github.event.inputs.to_tag }}
        run: |
          set -euo pipefail
          chmod +x tools/cockpit-release
          expected="$(awk -v name="cockpit-release" '$2 == name {print $1}' tools/cockpit-release.sha256)"
          if command -v sha256sum >/dev/null 2>&1; then actual="$(sha256sum tools/cockpit-release | awk '{print $1}')"; else actual="$(shasum -a 256 tools/cockpit-release | awk '{print $1}')"; fi
          test -n "$expected" && test "$expected" = "$actual"
          export COCKPIT_RELEASE_BIN="$GITHUB_WORKSPACE/tools/cockpit-release"
          version="$(cargo metadata --locked --format-version 1 | jq -er '.packages[] | select(.name == "cockpit-cli") | .version')"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PUBLISH_EXISTING_TAG" == true ]]; then
            test "$INPUT_TO_TAG" = "$tag"
            commit="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
            test -n "$commit"
          else
            commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            test "$commit" = "$GITHUB_SHA"
          fi
          lock_sha="$(shasum -a 256 Cargo.lock | awk '{print $1}')"
          "$COCKPIT_RELEASE_BIN" manifest \
            --dist dist \
            --output dist/release-manifest.json \
            --version "$version" \
            --tag "$tag" \
            --commit "$commit" \
            --cargo-lock-sha256 "$lock_sha"
          mkdir -p dist/Formula
          "$COCKPIT_RELEASE_BIN" formula \
            --manifest dist/release-manifest.json \
            --output dist/Formula/ai-cockpit.rb
          "$COCKPIT_RELEASE_BIN" checksums \
            --manifest dist/release-manifest.json \
            --dist dist
          "$COCKPIT_RELEASE_BIN" validate \
            --manifest dist/release-manifest.json --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: ai-cockpit-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release_policy:
    needs: [aggregate, source_quality, release_tools]
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - name: Enforce immutable release identity and determine provider state
        id: release_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_EXISTING_TAG: ${{ github.event.inputs.publish_existing_tag || 'false' }}
          INPUT_TO_TAG: ${{ github.event.inputs.to_tag }}
        run: |
          set -euo pipefail
          chmod +x tools/cockpit-release
          (cd tools && sha256sum -c cockpit-release.sha256)
          version="$(jq -er '.version' dist/release-manifest.json)"
          tag="v${version}"
          test "$(jq -er '.tag' dist/release-manifest.json)" = "$tag"
          test "$(jq -er '.cargoLockSha256' dist/release-manifest.json)" = "$(shasum -a 256 Cargo.lock | awk '{print $1}')"
          manifest_commit="$(jq -er '.commit' dist/release-manifest.json)"
          tag_commit="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          test -n "$tag_commit"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$manifest_commit" = "$GITHUB_SHA"
            test "$GITHUB_REF_NAME" = "$tag"
            before="$(jq -er '.before' "$GITHUB_EVENT_PATH")"
            test "$before" = "0000000000000000000000000000000000000000"
            test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
            git fetch origin main --depth=1
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            test "$tag_commit" = "$manifest_commit"
            release_json="$RUNNER_TEMP/provider-release.json"
            release_error="$RUNNER_TEMP/provider-release.error"
            set +e
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/${tag}" > "$release_json" 2> "$release_error"
            release_status=$?
            set -e
            if [[ "$release_status" -eq 0 ]]; then
              "$GITHUB_WORKSPACE/tools/cockpit-release" verify-provider-release \
                --manifest dist/release-manifest.json \
                --dist dist \
                --release-json "$release_json" \
                --tag-commit "$tag_commit" | jq '. + {schemaVersion:1}' \
                > "$RUNNER_TEMP/provider-release-state.json"
            elif grep -Eq 'HTTP 404|Not Found' "$release_error"; then
              jq -n --arg tag "$tag" --arg commit "$manifest_commit" \
                '{schemaVersion:1,state:"new",tag:$tag,commit:$commit}' \
                > "$RUNNER_TEMP/provider-release-state.json"
            else
              cat "$release_error" >&2
              echo 'unable to determine provider Release state; refusing to publish' >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PUBLISH_EXISTING_TAG" == true ]]; then
            test "$INPUT_TO_TAG" = "$tag"
            test "$manifest_commit" = "$tag_commit"
            release_json="$RUNNER_TEMP/provider-release.json"
            release_error="$RUNNER_TEMP/provider-release.error"
            set +e
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/${tag}" > "$release_json" 2> "$release_error"
            release_status=$?
            set -e
            if [[ "$release_status" -eq 0 ]]; then
              "$GITHUB_WORKSPACE/tools/cockpit-release" verify-provider-release \
                --manifest dist/release-manifest.json \
                --dist dist \
                --release-json "$release_json" \
                --tag-commit "$tag_commit" | jq '. + {schemaVersion:1}' \
                > "$RUNNER_TEMP/provider-release-state.json"
            elif grep -Eq 'HTTP 404|Not Found' "$release_error"; then
              jq -n --arg tag "$tag" --arg commit "$manifest_commit" \
                '{schemaVersion:1,state:"new",tag:$tag,commit:$commit}' \
                > "$RUNNER_TEMP/provider-release-state.json"
            else
              cat "$release_error" >&2
              echo 'unable to determine provider Release state; refusing to publish' >&2
              exit 1
            fi
          else
            jq -n --arg tag "$tag" --arg commit "$manifest_commit" \
              '{schemaVersion:1,state:"not_applicable",tag:$tag,commit:$commit}' \
              > "$RUNNER_TEMP/provider-release-state.json"
          fi
          provider_state="$(jq -er '.state' "$RUNNER_TEMP/provider-release-state.json")"
          echo "state=$provider_state" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: provider-release-state
          path: ${{ runner.temp }}/provider-release-state.json
          if-no-files-found: error
          retention-days: 7

  verify:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [aggregate, source_quality, release_policy, release_tools]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - name: Verify manifest, checksums, and archive members
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/cockpit-release
          (cd tools && sha256sum -c cockpit-release.sha256)
          export COCKPIT_RELEASE_BIN="$GITHUB_WORKSPACE/tools/cockpit-release"
          "$COCKPIT_RELEASE_BIN" validate \
            --manifest dist/release-manifest.json --dist dist
          version="$(jq -er '.version' dist/release-manifest.json)"
          test -n "$version"
          for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
            if [[ "$target" == x86_64-pc-windows-msvc ]]; then extension=zip; else extension=tar.gz; fi
            "$COCKPIT_RELEASE_BIN" inspect \
              --archive "dist/ai-cockpit-v${version}-${target}.${extension}" --target "$target"
          done

  smoke_homebrew:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [aggregate, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            helper_artifact: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            helper_artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cockpit-release-tool-${{ matrix.helper_artifact }}
          path: tools
      - name: Install and uninstall the staged Formula
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version' dist/release-manifest.json)"
          test -n "$version"
          tag="v${version}"
          archive="ai-cockpit-${tag}-${TARGET}.tar.gz"
          mkdir -p "serve/${tag}" Formula
          cp "dist/${archive}" "serve/${tag}/${archive}"
          python3 - "$PWD/serve" >/tmp/ai-cockpit-http-port 2>/tmp/ai-cockpit-http.log <<'PY' &
          import functools
          import http.server
          import sys
          import socketserver

          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=sys.argv[1])
          with socketserver.TCPServer(("127.0.0.1", 0), handler) as server:
              print(server.server_address[1], flush=True)
              server.serve_forever()
          PY
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -s /tmp/ai-cockpit-http-port ]] && break
            sleep 0.1
          done
          port="$(cat /tmp/ai-cockpit-http-port)"
          curl --fail --silent "http://127.0.0.1:${port}/${tag}/${archive}" -o /dev/null
          chmod +x tools/cockpit-release
          expected="$(awk -v name="cockpit-release" '$2 == name {print $1}' tools/cockpit-release.sha256)"
          if command -v sha256sum >/dev/null 2>&1; then actual="$(sha256sum tools/cockpit-release | awk '{print $1}')"; else actual="$(shasum -a 256 tools/cockpit-release | awk '{print $1}')"; fi
          test -n "$expected" && test "$expected" = "$actual"
          tools/cockpit-release formula \
            --manifest dist/release-manifest.json \
            --fixture-base-url "http://127.0.0.1:${port}/" \
            --output Formula/ai-cockpit.rb
          brew tap-new --no-git ai-cockpit/smoke
          tap_root="$(brew --repository)/Library/Taps/ai-cockpit/homebrew-smoke"
          mkdir -p "${tap_root}/Formula"
          cp Formula/ai-cockpit.rb "${tap_root}/Formula/ai-cockpit.rb"
          brew install --formula ai-cockpit/smoke/ai-cockpit
          brew test ai-cockpit/smoke/ai-cockpit
          ai-cockpit --version
          brew uninstall ai-cockpit/smoke/ai-cockpit
          brew untap ai-cockpit/smoke
          ! brew list --formula | grep -Fx ai-cockpit

  smoke_linux:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [aggregate, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - name: Verify and run Linux archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version' dist/release-manifest.json)"
          test -n "$version"
          archive="ai-cockpit-v${version}-${TARGET}.tar.gz"
          expected="$(awk -v name="$archive" '$2 == name {print $1}' dist/SHA256SUMS)"
          actual="$(sha256sum "dist/${archive}" | awk '{print $1}')"
          test -n "$expected" && test "$expected" = "$actual"
          mkdir extracted
          tar -xzf "dist/${archive}" -C extracted
          ./extracted/ai-cockpit --version
          ./extracted/ai-cockpit --help >/dev/null

  smoke_windows:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [aggregate, verify]
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - name: Verify and run Windows archive
        shell: pwsh
        run: |
          $version = (Get-Content dist/release-manifest.json -Raw | ConvertFrom-Json).version
          $archive = "ai-cockpit-v$version-x86_64-pc-windows-msvc.zip"
          $expected = (Get-Content dist/SHA256SUMS | Where-Object { $_ -match [regex]::Escape($archive) } | ForEach-Object { ($_ -split '\s+')[0] }).ToLowerInvariant()
          $actual = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Windows archive checksum mismatch' }
          Expand-Archive "dist/$archive" -DestinationPath extracted
          ./extracted/ai-cockpit.exe --version
          ./extracted/ai-cockpit.exe --help | Out-Null

  staged_adopter_acceptance:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [aggregate, source_quality, release_policy, verify, release_tools]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_existing_tag == 'true' || github.event.inputs.post_release_acceptance == 'true') && github.event.inputs.to_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - name: Restore staged adopter receipt on rerun
        if: github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged-adopter-acceptance"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "staged-adopter-acceptance-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" \
            --dir "$RUNNER_TEMP/staged-adopter-acceptance"
      - name: Run staged candidate adopter acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COCKPIT_RELEASE_BIN: ${{ github.workspace }}/tools/cockpit-release
          ACCEPTANCE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          chmod +x "$COCKPIT_RELEASE_BIN"
          (cd tools && sha256sum -c cockpit-release.sha256)
          tag="$(jq -er '.tag' dist/release-manifest.json)"
          output="$RUNNER_TEMP/staged-adopter-acceptance"
          mkdir -p "$output"
          resume_args=()
          if (( GITHUB_RUN_ATTEMPT > 1 )); then resume_args+=(--resume); fi
          tests/release/adopter_acceptance.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --target x86_64-unknown-linux-gnu \
            --candidate-dir dist \
            --source-repo "$GITHUB_WORKSPACE" \
            "${resume_args[@]}" \
            --output "$output"
      - name: Upload staged adopter acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staged-adopter-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staged-adopter-acceptance/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  staged_adopter_upgrade_acceptance:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [aggregate, source_quality, release_policy, verify, release_tools]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_existing_tag == 'true' || github.event.inputs.post_release_acceptance == 'true') && github.event.inputs.to_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - name: Restore staged N-1 receipt on rerun
        if: github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged-adopter-upgrade"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "staged-adopter-upgrade-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" \
            --dir "$RUNNER_TEMP/staged-adopter-upgrade"
      - name: Resolve public N-1 and staged candidate pair
        id: staged_release_pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FROM_TAG: ${{ github.event.inputs.from_tag }}
          INPUT_TO_TAG: ${{ github.event.inputs.to_tag }}
        run: |
          set -euo pipefail
          to_tag="$(jq -er '.tag' dist/release-manifest.json)"
          if [[ "$EVENT_NAME" == workflow_dispatch && -n "$INPUT_TO_TAG" && "$INPUT_TO_TAG" != "$to_tag" ]]; then
            echo 'manual to_tag does not match staged candidate identity' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch && -n "$INPUT_FROM_TAG" ]]; then
            from_tag="$INPUT_FROM_TAG"
          else
            published_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))) | .tag_name' \
              | sort -V)"
            from_tag=''
            while IFS= read -r candidate; do
              [[ -n "$candidate" && "$candidate" != "$to_tag" ]] || continue
              if [[ "$(printf '%s\n%s\n' "$candidate" "$to_tag" | sort -V | tail -n 1)" == "$to_tag" ]]; then
                from_tag="$candidate"
              fi
            done <<< "$published_tags"
          fi
          [[ "$to_tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo 'candidate tag is not canonical' >&2; exit 1; }
          if [[ -n "$from_tag" ]]; then
            [[ "$from_tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ && "$from_tag" != "$to_tag" ]] || { echo 'invalid staged N-1 pair' >&2; exit 1; }
            [[ "$(printf '%s\n%s\n' "$from_tag" "$to_tag" | sort -V | tail -n 1)" == "$to_tag" ]] || { echo 'staged N-1 must be older than candidate' >&2; exit 1; }
          fi
          echo "from_tag=$from_tag" >> "$GITHUB_OUTPUT"
          echo "to_tag=$to_tag" >> "$GITHUB_OUTPUT"
      - name: Run public-to-staged N-1 acceptance
        if: steps.staged_release_pair.outputs.from_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COCKPIT_RELEASE_BIN: ${{ github.workspace }}/tools/cockpit-release
          ACCEPTANCE_ATTEMPT: ${{ github.run_attempt }}
          FROM_TAG: ${{ steps.staged_release_pair.outputs.from_tag }}
          TO_TAG: ${{ steps.staged_release_pair.outputs.to_tag }}
        run: |
          set -euo pipefail
          chmod +x "$COCKPIT_RELEASE_BIN"
          (cd tools && sha256sum -c cockpit-release.sha256)
          output="$RUNNER_TEMP/staged-adopter-upgrade"
          mkdir -p "$output"
          resume_args=()
          if (( GITHUB_RUN_ATTEMPT > 1 )); then resume_args+=(--resume); fi
          tests/release/adopter_upgrade_acceptance.sh \
            --repository "$GITHUB_REPOSITORY" \
            --from-tag "$FROM_TAG" \
            --to-tag "$TO_TAG" \
            --target x86_64-unknown-linux-gnu \
            --to-candidate-dir dist \
            --source-repo "$GITHUB_WORKSPACE" \
            "${resume_args[@]}" \
            --output "$output"
      - name: Record staged N-1 not-applicable result
        if: steps.staged_release_pair.outputs.from_tag == ''
        shell: bash
        env:
          TO_TAG: ${{ steps.staged_release_pair.outputs.to_tag }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/staged-adopter-upgrade"
          mkdir -p "$output"
          jq -n --arg toTag "$TO_TAG" \
            '{schemaVersion:1,releasePublished:false,stagedCandidate:true,adopterAcceptance:"not_applicable",fromTag:null,toTag:$toTag,target:"x86_64-unknown-linux-gnu",reason:"no previous published Release"}' \
            > "$output/acceptance.json"
          printf '%s  %s\n' "$(sha256sum "$output/acceptance.json" | awk '{print $1}')" acceptance.json > "$output/SHA256SUMS"
      - name: Upload staged N-1 acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staged-adopter-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staged-adopter-upgrade/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  attest:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
    needs: [build, aggregate, source_quality, release_policy, verify, smoke_homebrew, smoke_linux, smoke_windows, staged_adopter_acceptance, staged_adopter_upgrade_acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - name: Attest the final candidate bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/ai-cockpit-v*-*.spdx.json
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/Formula/ai-cockpit.rb

  publish:
    if: >-
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing_tag == 'true')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true')
    needs: [build, aggregate, source_quality, release_policy, verify, smoke_homebrew, smoke_linux, smoke_windows, staged_adopter_acceptance, staged_adopter_upgrade_acceptance, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: provider-release-state
          path: provider-state
      - name: Download the shared release helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - name: Recheck immutable tag and provider Release identity
        shell: bash
        id: release_identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x tools/cockpit-release
          (cd tools && sha256sum -c cockpit-release.sha256)
          test "$(jq -er '.state' provider-state/provider-release-state.json)" = reused -o \
            "$(jq -er '.state' provider-state/provider-release-state.json)" = new
          tag="$(jq -er '.tag' dist/release-manifest.json)"
          test "$tag" = "$RELEASE_TAG"
          manifest_commit="$(jq -er '.commit' dist/release-manifest.json)"
          tag_commit="$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')"
          test "$manifest_commit" = "$tag_commit"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$manifest_commit" = "$GITHUB_SHA"
          fi
          state="$(jq -er '.state' provider-state/provider-release-state.json)"
          release_json="$RUNNER_TEMP/provider-release-recheck.json"
          release_error="$RUNNER_TEMP/provider-release-recheck.error"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/${tag}" > "$release_json" 2> "$release_error"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            tag_commit="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
            "$GITHUB_WORKSPACE/tools/cockpit-release" verify-provider-release \
              --manifest dist/release-manifest.json \
              --dist dist \
              --release-json "$release_json" \
              --tag-commit "$tag_commit" >/dev/null
            state=reused
          elif [[ "$state" != new ]] || ! grep -Eq 'HTTP 404|Not Found' "$release_error"; then
            cat "$release_error" >&2
            echo 'provider Release disappeared or could not be inspected; refusing to publish' >&2
            exit 1
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0
        if: steps.release_identity.outputs.state == 'new'
        with:
          tag_name: ${{ github.event.inputs.to_tag || github.ref_name }}
          files: |
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/Formula/ai-cockpit.rb
            dist/*.tar.gz
            dist/*.zip
            dist/ai-cockpit-v*-*.spdx.json
          generate_release_notes: true

  publish_handoff:
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing_tag == 'true' && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true' && needs.post_release_helper.result == 'success' && needs.release_input_preflight.result == 'success'))
    needs: [publish, post_release_helper, release_input_preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
        with:
          name: ai-cockpit-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true'
        with:
          name: post-release-helper
          path: tools
      - name: Download and verify the immutable public Release for recovery
        # post-release-only recovery has no candidate artifact and no publish
        # job; this is the public identity boundary for the existing Release.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.to_tag }}
        run: |
          set -euo pipefail
          chmod +x tools/cockpit-release
          (cd tools && sha256sum -c cockpit-release.sha256)
          mkdir -p dist/Formula
          release_json="$RUNNER_TEMP/public-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$release_json"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$release_json" >/dev/null
          while IFS=$'\t' read -r name url; do
            [[ "$url" == "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"* ]] || {
              echo "public Release asset URL is outside the immutable tag: $name" >&2
              exit 1
            }
            if [[ "$name" == ai-cockpit.rb ]]; then destination="dist/Formula/$name"; else destination="dist/$name"; fi
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$url" -o "$destination"
          done < <(jq -r '.assets[] | [.name, .browser_download_url] | @tsv' "$release_json")
          tag_commit="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'immutable public tag does not resolve' >&2; exit 1; }
          tools/cockpit-release verify-provider-release \
            --manifest dist/release-manifest.json \
            --dist dist \
            --release-json "$release_json" \
            --tag-commit "$tag_commit" \
            > dist/provider-release-state.json
      - name: Create the post-publication handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x tools/cockpit-release
          (cd tools && sha256sum -c cockpit-release.sha256)
          tag="$(jq -er '.tag' dist/release-manifest.json)"
          test "$tag" = "$RELEASE_TAG"
          provider_release_id=''
          for attempt in {1..30}; do
            provider_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${tag}" --jq '.id' 2>/dev/null || true)"
            if [[ "$provider_release_id" =~ ^[1-9][0-9]*$ ]]; then break; fi
            sleep 2
          done
          test "$provider_release_id" -gt 0
          commit="$(jq -er '.commit' dist/release-manifest.json)"
          # Tag pushes publish the tag's source commit directly. Recovery runs
          # intentionally execute from the current orchestration revision, so
          # the typed handoff carries both identities and this equality guard
          # applies only to the direct tag-triggered path.
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_SHA" = "$commit"
          fi
          manifest_sha="$(shasum -a 256 dist/release-manifest.json | awk '{print $1}')"
          formula_sha="$(shasum -a 256 dist/Formula/ai-cockpit.rb | awk '{print $1}')"
          issued="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires="$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)"
          tools/cockpit-release handoff \
            --output dist/homebrew-handoff.json \
            --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/release.yml@${GITHUB_SHA}" \
            --run-id "$GITHUB_RUN_ID" \
            --tag "$tag" \
            --commit "$commit" \
            --provider-release-id "$provider_release_id" \
            --manifest-sha256 "$manifest_sha" \
            --formula-sha256 "$formula_sha" \
            --issued-at "$issued" \
            --expires-at "$expires"
          test "$(jq -er '.release.providerReleaseId' dist/homebrew-handoff.json)" = "$provider_release_id"
      - name: Attest the handoff
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/homebrew-handoff.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-cockpit-publish-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/homebrew-handoff.json
          if-no-files-found: error
          retention-days: 7

  post_release_version_consistency:
    # This is a post-publication truth check. It never rewrites or unpublishes
    # a Release; it fails the workflow if public assets drift from the source
    # version or the current trilingual installation docs.
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing_tag == 'true' && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true' && needs.release_input_preflight.result == 'success'))
    needs: [publish, release_input_preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.to_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: Restore version consistency receipt on rerun
        if: github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/post-release-version-consistency"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "post-release-version-consistency-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" \
            --dir "$RUNNER_TEMP/post-release-version-consistency"
      - name: Verify public Release and current documentation version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/post-release-version-consistency"
          mkdir -p "$output"
          set +e
          tests/release/version_consistency.sh \
            --repo "$GITHUB_WORKSPACE" \
            --post-release \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" > "$output/version-consistency.log" 2>&1
          result=$?
          set -e
          state=failed
          [[ "$result" -eq 0 ]] && state=passed
          commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$commit" --arg state "$state" \
            '{schemaVersion:1,phase:"public_version_consistency",tag:$tag,commit:$commit,state:$state}' \
            > "$output/version-consistency.json"
          cat "$output/version-consistency.log"
          exit "$result"
      - name: Upload version consistency receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-release-version-consistency-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-release-version-consistency/
          if-no-files-found: error
          retention-days: 30

  adopter_acceptance:
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.publish_handoff.result == 'success' && needs.release_tools.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing_tag == 'true' && needs.publish_handoff.result == 'success' && needs.release_tools.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true' && needs.publish_handoff.result == 'success' && needs.post_release_helper.result == 'success'))
    needs: [publish_handoff, release_tools, post_release_helper]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.to_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true'
        with:
          name: post-release-helper
          path: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: ai-cockpit-publish-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff
      - name: Restore publication handoff on rerun
        if: github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -f handoff/homebrew-handoff.json ]]; then
            mkdir -p handoff
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "ai-cockpit-publish-handoff-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" \
              --dir handoff
          fi
      - name: Restore public install receipt on rerun
        if: github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-adopter-acceptance"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-adopter-acceptance-${RELEASE_TAG}-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" \
            --dir "$RUNNER_TEMP/release-adopter-acceptance"
      - name: Run public Release adopter acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COCKPIT_RELEASE_BIN: ${{ github.workspace }}/tools/cockpit-release
          ACCEPTANCE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x "$COCKPIT_RELEASE_BIN"
          (cd tools && sha256sum -c cockpit-release.sha256)
          mkdir -p "$RUNNER_TEMP/release-adopter-acceptance"
          resume_args=()
          if (( GITHUB_RUN_ATTEMPT > 1 )); then resume_args+=(--resume); fi
          tests/release/adopter_acceptance.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --target x86_64-unknown-linux-gnu \
            --source-repo "$GITHUB_WORKSPACE" \
            --publish-handoff "$GITHUB_WORKSPACE/handoff/homebrew-handoff.json" \
            "${resume_args[@]}" \
            --output "$RUNNER_TEMP/release-adopter-acceptance"
      - name: Upload adopter acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-adopter-acceptance-${{ github.event.inputs.to_tag || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-adopter-acceptance/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  adopter_upgrade_acceptance:
    # Pushes run only after the provider Release and publication handoff are
    # successful. A recovery dispatch consumes the current run's publication
    # handoff; an ordinary manual run consumes explicitly named public Releases.
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
        needs.publish.result == 'success' &&
        needs.publish_handoff.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_existing_tag == 'true' &&
        needs.publish.result == 'success' &&
        needs.publish_handoff.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_existing_tag != 'true' &&
        github.event.inputs.post_release_acceptance != 'true' &&
        github.event.inputs.from_tag != '' &&
        github.event.inputs.to_tag != '' &&
        github.event.inputs.handoff_run_id != '') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.post_release_acceptance == 'true' &&
        needs.publish_handoff.result == 'success' &&
        needs.post_release_helper.result == 'success'))
    needs: [publish, publish_handoff, release_tools, post_release_helper]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.to_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.post_release_acceptance != 'true'
        with:
          name: cockpit-release-tool-ubuntu-x86_64
          path: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true'
        with:
          name: post-release-helper
          path: tools
      - name: Download publication handoff for push-triggered public acceptance
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: ${{ github.run_attempt > 1 }}
        with:
          name: ai-cockpit-publish-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff
      - name: Download publication handoff for tag recovery
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing_tag == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-publish-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff
      - name: Download publication handoff for post-release-only recovery
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.post_release_acceptance == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ai-cockpit-publish-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff
      - name: Restore publication handoff on rerun
        if: github.event_name == 'push' && github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f handoff/homebrew-handoff.json ]]; then
            mkdir -p handoff
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "ai-cockpit-publish-handoff-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" \
              --dir handoff
          fi
      - name: Download handoff from the requested publication run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing_tag != 'true' && github.event.inputs.post_release_acceptance != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_RUN_ID: ${{ github.event.inputs.handoff_run_id }}
        run: |
          set -euo pipefail
          [[ "$HANDOFF_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'manual public acceptance requires a completed handoff_run_id' >&2
            exit 1
          }
          conclusion="$(gh run view "$HANDOFF_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          test "$conclusion" = success || {
            echo 'manual public acceptance requires a successful publication run' >&2
            exit 1
          }
          handoff_artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HANDOFF_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("ai-cockpit-publish-handoff-"))) | {name,created_at}] | sort_by(.created_at) | last.name // empty')"
          [[ -n "$handoff_artifact" ]] || {
            echo 'manual public acceptance could not find a non-expired publication handoff artifact' >&2
            exit 1
          }
          mkdir -p handoff
          gh run download "$HANDOFF_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$handoff_artifact" \
            --dir handoff
      - name: Restore public upgrade receipt on rerun
        if: github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-adopter-upgrade"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-adopter-upgrade-${RELEASE_TAG}-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" \
            --dir "$RUNNER_TEMP/release-adopter-upgrade"
      - name: Resolve immutable public Release pair
        id: release_pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FROM_TAG: ${{ github.event.inputs.from_tag }}
          INPUT_TO_TAG: ${{ github.event.inputs.to_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            from_tag="$INPUT_FROM_TAG"
            to_tag="$INPUT_TO_TAG"
          else
            to_tag="$GITHUB_REF_NAME"
            published_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))) | .tag_name' | sort -V)"
            from_tag=''
            while IFS= read -r candidate; do
              [[ -n "$candidate" && "$candidate" != "$to_tag" ]] || continue
              if [[ "$(printf '%s\n%s\n' "$candidate" "$to_tag" | sort -V | tail -n 1)" == "$to_tag" ]]; then
                from_tag="$candidate"
              fi
            done <<< "$published_tags"
          fi
          [[ "$to_tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || {
            echo "to_tag is not a canonical semantic Release tag" >&2
            exit 1
          }
          if [[ -z "$from_tag" ]]; then
            echo "No previous published Release exists; N-1 is not applicable."
            echo "from_tag=" >> "$GITHUB_OUTPUT"
          else
            [[ "$from_tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || {
              echo "from_tag is not a canonical semantic Release tag" >&2
              exit 1
            }
            [[ "$from_tag" != "$to_tag" ]] || {
              echo "from_tag and to_tag must be distinct" >&2
              exit 1
            }
            [[ "$(printf '%s\n%s\n' "$from_tag" "$to_tag" | sort -V | tail -n 1)" == "$to_tag" ]] || {
              echo "from_tag must be an older published Release than to_tag" >&2
              exit 1
            }
            echo "from_tag=$from_tag" >> "$GITHUB_OUTPUT"
          fi
          echo "to_tag=$to_tag" >> "$GITHUB_OUTPUT"
      - name: Run public-artifact N-1 upgrade acceptance
        if: steps.release_pair.outputs.from_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COCKPIT_RELEASE_BIN: ${{ github.workspace }}/tools/cockpit-release
          ACCEPTANCE_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          FROM_TAG: ${{ steps.release_pair.outputs.from_tag }}
          TO_TAG: ${{ steps.release_pair.outputs.to_tag }}
          TARGET: ${{ github.event.inputs.target || 'x86_64-unknown-linux-gnu' }}
        run: |
          set -euo pipefail
          chmod +x "$COCKPIT_RELEASE_BIN"
          (cd tools && sha256sum -c cockpit-release.sha256)
          mkdir -p "$RUNNER_TEMP/release-adopter-upgrade"
          resume_args=()
          if (( GITHUB_RUN_ATTEMPT > 1 )); then resume_args+=(--resume); fi
          handoff_args=()
          if [[ "$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch ]]; then
            handoff_args=(--publish-handoff "$GITHUB_WORKSPACE/handoff/homebrew-handoff.json")
          fi
          tests/release/adopter_upgrade_acceptance.sh \
            --repository "$GITHUB_REPOSITORY" \
            --from-tag "$FROM_TAG" \
            --to-tag "$TO_TAG" \
            --target "$TARGET" \
            --source-repo "$GITHUB_WORKSPACE" \
            "${handoff_args[@]}" \
            "${resume_args[@]}" \
            --output "$RUNNER_TEMP/release-adopter-upgrade"
      - name: Record N-1 not-applicable result
        if: steps.release_pair.outputs.from_tag == ''
        shell: bash
        env:
          TO_TAG: ${{ steps.release_pair.outputs.to_tag }}
          TARGET: ${{ github.event.inputs.target || 'x86_64-unknown-linux-gnu' }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/release-adopter-upgrade"
          mkdir -p "$output"
          jq -n \
            --arg toTag "$TO_TAG" \
            --arg target "$TARGET" \
            '{schemaVersion:1,releasePublished:true,adopterAcceptance:"not_applicable",fromTag:null,toTag:$toTag,target:$target,reason:"no previous published Release"}' \
            > "$output/acceptance.json"
          printf '%s  %s\n' "$(sha256sum "$output/acceptance.json" | awk '{print $1}')" acceptance.json \
            > "$output/SHA256SUMS"
      - name: Upload N-1 upgrade acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-adopter-upgrade-${{ github.event.inputs.to_tag || github.ref_name || github.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-adopter-upgrade/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  release_close:
    # The close barrier is deliberately after every public acceptance branch.
    # It records a failed close when any required receipt is absent; it never
    # rewrites a Release, moves a tag, or deletes historical evidence.
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.publish_existing_tag == 'true' || github.event.inputs.post_release_acceptance == 'true')))
    needs: [publish_handoff, post_release_version_consistency, adopter_acceptance, adopter_upgrade_acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always() && needs.publish_handoff.result == 'success'
        continue-on-error: true
        with:
          name: ai-cockpit-publish-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: close-inputs/handoff
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always() && needs.post_release_version_consistency.result == 'success'
        continue-on-error: true
        with:
          name: post-release-version-consistency-${{ github.run_id }}-${{ github.run_attempt }}
          path: close-inputs/version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always() && needs.adopter_acceptance.result == 'success'
        continue-on-error: true
        with:
          name: release-adopter-acceptance-${{ github.event.inputs.to_tag || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: close-inputs/install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always() && needs.adopter_upgrade_acceptance.result == 'success'
        continue-on-error: true
        with:
          name: release-adopter-upgrade-${{ github.event.inputs.to_tag || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: close-inputs/upgrade
      - name: Restore missing close inputs on rerun
        if: github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
        run: |
          set -u
          restore() {
            local path="$1" name="$2" directory="$3"
            [[ -f "$path" ]] && return 0
            mkdir -p "$directory"
            if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$name" --dir "$directory"; then
              echo "close input unavailable for this or the previous attempt: $path" >&2
            fi
          }
          restore close-inputs/handoff/homebrew-handoff.json \
            "ai-cockpit-publish-handoff-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" close-inputs/handoff
          restore close-inputs/version/version-consistency.json \
            "post-release-version-consistency-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" close-inputs/version
          restore close-inputs/install/acceptance.json \
            "release-adopter-acceptance-${RELEASE_TAG}-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" close-inputs/install
          restore close-inputs/upgrade/acceptance.json \
            "release-adopter-upgrade-${RELEASE_TAG}-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" close-inputs/upgrade
          restore close-inputs/install/phase-receipts.json \
            "release-adopter-acceptance-${RELEASE_TAG}-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" close-inputs/install
          restore close-inputs/upgrade/phase-receipts.json \
            "release-adopter-upgrade-${RELEASE_TAG}-${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" close-inputs/upgrade
      - name: Write release close receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.to_tag || github.ref_name }}
          COMMIT: ${{ github.sha }}
          HANDOFF: ${{ needs.publish_handoff.result }}
          VERSION_CONSISTENCY: ${{ needs.post_release_version_consistency.result }}
          INSTALL: ${{ needs.adopter_acceptance.result }}
          UPGRADE: ${{ needs.adopter_upgrade_acceptance.result }}
        run: |
          set -euo pipefail
          release_commit="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          test -n "$release_commit"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$release_commit" = "$COMMIT"
          fi
          COMMIT="$release_commit"
          output="$RUNNER_TEMP/release-close"
          mkdir -p "$output"
          state=passed
          reasons=()
          handoff_file=close-inputs/handoff/homebrew-handoff.json
          version_file=close-inputs/version/version-consistency.json
          install_file=close-inputs/install/acceptance.json
          install_phases=close-inputs/install/phase-receipts.json
          upgrade_file=close-inputs/upgrade/acceptance.json
          upgrade_phases=close-inputs/upgrade/phase-receipts.json
          require_receipt() {
            local path="$1" status="$2" label="$3"
            if [[ "$status" != success ]]; then
              state=failed; reasons+=("${label}_job_failed")
            elif [[ ! -f "$path" ]]; then
              state=failed; reasons+=("missing_${label}_receipt")
            fi
          }
          require_receipt "$handoff_file" "$HANDOFF" handoff
          require_receipt "$version_file" "$VERSION_CONSISTENCY" version_consistency
          require_receipt "$install_file" "$INSTALL" install
          require_receipt "$install_phases" "$INSTALL" install_phases
          if [[ "$UPGRADE" != success ]]; then
            state=failed; reasons+=(upgrade_job_failed_or_skipped)
          elif [[ ! -f "$upgrade_file" ]]; then
            state=failed; reasons+=(missing_upgrade_receipt)
          fi
          provider_release_id=''
          release_json="$RUNNER_TEMP/close-release.json"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$release_json" 2>/dev/null
          release_lookup=$?
          set -e
          if [[ "$release_lookup" -eq 0 ]]; then
            provider_release_id="$(jq -er '.id' "$release_json" 2>/dev/null || true)"
          else
            state=failed; reasons+=(provider_release_lookup_failed)
          fi
          if [[ -f "$handoff_file" ]]; then
            jq -e --arg tag "$TAG" --arg commit "$COMMIT" --argjson providerId "${provider_release_id:-0}" \
              '.release.tag == $tag and .release.commit == $commit and .release.providerReleaseId == $providerId' \
              "$handoff_file" >/dev/null || { state=failed; reasons+=(handoff_binding_invalid); }
          fi
          if [[ -f "$version_file" ]]; then
            jq -e --arg tag "$TAG" --arg commit "$COMMIT" \
              '.tag == $tag and .commit == $commit and .state == "passed"' "$version_file" >/dev/null || {
              state=failed; reasons+=(version_consistency_failed)
            }
          fi
          validate_acceptance() {
            local path="$1" phases="$2" label="$3"
            [[ -f "$path" ]] || return 0
            if jq -e '.adopterAcceptance == "not_applicable"' "$path" >/dev/null 2>&1; then
              jq -e --arg tag "$TAG" \
                '.schemaVersion == 1 and .adopterAcceptance == "not_applicable" and .releasePublished == true and .fromTag == null and .toTag == $tag and (.reason | type == "string" and length > 0)' \
                "$path" >/dev/null || { state=failed; reasons+=("${label}_not_applicable_receipt_invalid"); }
              return 0
            fi
            jq -e --arg tag "$TAG" \
              '.tag == $tag and .adopterAcceptance == "passed" and .cleanupState == "passed" and .closeDecision.validated == true' \
              "$path" >/dev/null || { state=failed; reasons+=("${label}_receipt_invalid"); }
            [[ -f "$phases" ]] || { state=failed; reasons+=("${label}_phase_receipt_missing"); return; }
            jq -e '.schemaVersion == 1 and ([.results[] | select(.phase == "close" and .status == "succeeded")] | length == 1)' "$phases" >/dev/null || {
              state=failed; reasons+=("${label}_phase_receipt_invalid")
            }
          }
          validate_acceptance "$install_file" "$install_phases" install
          validate_acceptance "$upgrade_file" "$upgrade_phases" upgrade
          reason_json='[]'
          if ((${#reasons[@]} > 0)); then
            reason_json="$(printf '%s\n' "${reasons[@]}" | jq -R . | jq -s .)"
          fi
          handoff_digest=null; version_digest=null; install_digest=null; install_phase_digest=null; upgrade_digest=null; upgrade_phase_digest=null
          [[ -f "$handoff_file" ]] && handoff_digest="$(sha256sum "$handoff_file" | awk '{print "\"sha256:" $1 "\""}')"
          [[ -f "$version_file" ]] && version_digest="$(sha256sum "$version_file" | awk '{print "\"sha256:" $1 "\""}')"
          [[ -f "$install_file" ]] && install_digest="$(sha256sum "$install_file" | awk '{print "\"sha256:" $1 "\""}')"
          [[ -f "$install_phases" ]] && install_phase_digest="$(sha256sum "$install_phases" | awk '{print "\"sha256:" $1 "\""}')"
          [[ -f "$upgrade_file" ]] && upgrade_digest="$(sha256sum "$upgrade_file" | awk '{print "\"sha256:" $1 "\""}')"
          [[ -f "$upgrade_phases" ]] && upgrade_phase_digest="$(sha256sum "$upgrade_phases" | awk '{print "\"sha256:" $1 "\""}')"
          jq -n \
            --arg tag "$TAG" \
            --arg commit "$COMMIT" \
            --arg state "$state" \
            --arg providerReleaseId "$provider_release_id" \
            --arg handoffState "$HANDOFF" \
            --arg versionState "$VERSION_CONSISTENCY" \
            --arg installState "$INSTALL" \
            --arg upgradeState "$UPGRADE" \
            --argjson reasons "$reason_json" \
            --argjson handoffDigest "$handoff_digest" \
            --argjson versionDigest "$version_digest" \
            --argjson installDigest "$install_digest" \
            --argjson installPhaseDigest "$install_phase_digest" \
            --argjson upgradeDigest "$upgrade_digest" \
            --argjson upgradePhaseDigest "$upgrade_phase_digest" \
            '{schemaVersion:2,phase:"close",tag:$tag,commit:$commit,state:$state,providerReleaseId:(if $providerReleaseId == "" then null else ($providerReleaseId|tonumber) end),requiredReceipts:{publishHandoff:{jobState:$handoffState,digest:$handoffDigest},versionConsistency:{jobState:$versionState,digest:$versionDigest},publicInstall:{jobState:$installState,digest:$installDigest,phaseDigest:$installPhaseDigest},publicUpgrade:{jobState:$upgradeState,digest:$upgradeDigest,phaseDigest:$upgradePhaseDigest}},failureRoots:$reasons}' \
            > "$output/release-close.json"
          sha256sum "$output/release-close.json" | awk '{print $1 "  release-close.json"}' > "$output/SHA256SUMS"
          if [[ "$state" != passed ]]; then
            echo 'release close recorded failure; dependent acceptance was not executed' >&2
          fi
      - name: Upload release close receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-close-${{ github.event.inputs.to_tag || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-close/
          if-no-files-found: error
          retention-days: 30
      - name: Fail when the close receipt is not passed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.state == "passed"' "$RUNNER_TEMP/release-close/release-close.json" >/dev/null || {
            echo 'release close receipt is not passed; the close job must remain failed' >&2
            exit 1
          }
