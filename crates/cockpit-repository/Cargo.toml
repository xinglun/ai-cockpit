[package]
name = "cockpit-repository"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cap-std.workspace = true
cap-fs-ext.workspace = true
chrono.workspace = true
cockpit-git = { path = "../cockpit-git" }
cockpit-protocol = { path = "../cockpit-protocol" }
cockpit-verification = { path = "../cockpit-verification" }
cockpit-core = { path = "../cockpit-core" }
cockpit-evidence = { path = "../cockpit-evidence" }
cockpit-knowledge = { path = "../cockpit-knowledge" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }
