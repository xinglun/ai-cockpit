[workspace]
resolver = "2"
members = [
    "crates/cockpit-core",
    "crates/cockpit-protocol",
    "crates/cockpit-git",
    "crates/cockpit-repository",
    "crates/cockpit-evidence",
    "crates/cockpit-verification",
    "crates/cockpit-knowledge",
    "crates/cockpit-mcp",
    "crates/cockpit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"

